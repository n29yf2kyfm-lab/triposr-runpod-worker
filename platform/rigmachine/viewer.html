<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__CAR__</title>
<style>
:root{--ground:#1b1c1f;--bar:rgba(30,31,35,.72);--text:#eceef2;--muted:#a3a7b0;--accent:#4f8cff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;pointer-events:none}
header b{display:block;font-size:17px;letter-spacing:-.01em}
header span{color:var(--muted);font-size:13px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;border-radius:22px;background:var(--bar);border:1px solid var(--line);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);max-width:calc(100% - 32px);overflow-x:auto}
nav button{min-height:44px;padding:0 12px;border-radius:14px;border:0;background:transparent;color:var(--text);font:inherit;font-weight:600;white-space:nowrap;cursor:pointer}
nav button[aria-pressed="true"]{background:rgba(255,255,255,.14)}
nav button.primary{background:var(--accent);color:#fff}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none;padding:24px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b data-title>__CAR__</b><span data-hint>Drag to turn</span></header>
<div id="msg">Loading the car…</div>
<nav hidden></nav>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const CAR = '__CAR__', GLB = '__GLB__';
const msg = document.getElementById('msg'), nav = document.querySelector('nav');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1c1f);
scene.fog = new THREE.Fog(0x1b1c1f, 12, 40);          // the floor fades out instead of ending in an edge
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(4, 8, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); scene.add(key);
const floor = new THREE.Mesh(new THREE.CircleGeometry(80, 96), new THREE.MeshStandardMaterial({ color: 0x26272b, roughness: .9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// Motion, in the Strip Bay frame (+Y up, nose +Z, car's left +X), with the
// same numbers as the Blender rig (platform/trainer/blender_addon/rig.py).
const D = Math.PI / 180;
const MOVE = {
  swing: (g, p) => { g.rotation.y = p * -g.userData.sx * 64 * D; },
  barn: (g, p) => { g.rotation.y = p * -g.userData.sx * 100 * D; },
  slide: (g, p) => { const m = g.userData.m, h = g.userData.home;
    g.position.x = h.x + g.userData.sx * m.out * Math.min(1, p * 4);
    g.position.z = h.z - m.back * Math.max(0, (p - .25) / .75); },
  bonnet: (g, p) => { g.rotation.x = p * -52 * D; },
  tailgate: (g, p) => { g.rotation.x = p * 62 * D; },
};
const parts = {};                                  // pid -> pivot group

function tween(g, to) {
  g.userData.to = to;
}

const [gltf, rep] = await Promise.all([
  new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(GLB),
  fetch(CAR + '.report.json').then(r => r.json()),
]).catch(e => { msg.textContent = 'This car could not be loaded: ' + e.message; throw e; });
const car = gltf.scene; scene.add(car);
car.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
car.updateMatrixWorld(true);
const byPid = {};
car.traverse(o => { const m = /^SB_([a-z_]+?)__\d+/.exec(o.name); if (m && !o.parent.name.startsWith('SB_' + m[1])) (byPid[m[1]] ||= []).push(o); });
for (const [pid, h] of Object.entries(rep.hinge || {})) {
  if (!byPid[pid]) continue;
  const g = new THREE.Group(); g.position.set(h.x, h.y, h.z); car.add(g); g.updateMatrixWorld(true);
  for (const o of byPid[pid]) g.attach(o);
  const m = (rep.motion || {})[pid] || {};
  g.userData = { pid, p: 0, to: 0, sx: pid.endsWith('l') ? 1 : -1, m, home: g.position.clone(),
    move: pid === 'panel_bonnet' ? MOVE.bonnet : pid === 'tailgate' ? MOVE.tailgate : m.type === 'slide' ? MOVE.slide : m.type === 'barn' ? MOVE.barn : MOVE.swing };
  g.traverse(o => { o.userData.pivot = g; });
  parts[pid] = g;
}

// frame the car
const box = new THREE.Box3().setFromObject(car), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
// fit the bounding sphere (with room for the open doors) to the NARROWER of
// the two fields of view, so a portrait phone sees the whole car
const radius = size.length() / 2 * 1.15;
function fit() {
  const v = camera.fov * Math.PI / 180, h = 2 * Math.atan(Math.tan(v / 2) * camera.aspect);
  const dist = radius / Math.sin(Math.min(v, h) / 2);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, dist);
  controls.minDistance = radius * .8; controls.maxDistance = dist * 2;
}
controls.target.set(c.x, size.y * .42, c.z);
camera.position.set(c.x + size.z * .7, size.y * 1.2, c.z + size.z * .8);    // front-left three-quarter
fit(); controls.update();

// buttons: only what this car actually has, one job each
const doorIds = Object.keys(parts).filter(k => k.startsWith('door_'));
const groups = [['Doors', doorIds], ['Bonnet', ['panel_bonnet']], ['Tailgate', ['tailgate']]]
  .map(([label, ids]) => [label, ids.filter(i => parts[i])]).filter(([, ids]) => ids.length);
const all = groups.flatMap(([, ids]) => ids);
function sync() { for (const b of nav.children) { const ids = JSON.parse(b.dataset.ids);
  b.setAttribute('aria-pressed', ids.every(i => parts[i].userData.to === 1)); } }
function toggle(ids) { const open = !ids.every(i => parts[i].userData.to === 1); for (const i of ids) tween(parts[i], open ? 1 : 0); sync(); }
for (const [label, ids] of [...groups, ['Open all', all]]) {
  const b = document.createElement('button'); b.textContent = label; b.dataset.ids = JSON.stringify(ids);
  if (label === 'Open all') b.className = 'primary';
  b.onclick = () => toggle(ids); nav.append(b);
}
if (!all.length) msg.textContent = 'Nothing on this car opens: its doors are part of the body.';
else { msg.hidden = true; nav.hidden = false; document.querySelector('[data-hint]').textContent = 'Drag to turn · tap a part to open it'; }

// tap a part to open or shut it
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(car, true).find(h => h.object.userData.pivot);
  if (hit) toggle([hit.object.userData.pivot.userData.pid]);
});

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
renderer.setAnimationLoop(t => {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  for (const g of Object.values(parts)) { const u = g.userData;
    if (u.p !== u.to) { u.p = reduce ? u.to : u.p + Math.sign(u.to - u.p) * Math.min(Math.abs(u.to - u.p), dt / .9); u.move(g, u.p); } }
  controls.update(); renderer.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fit(); renderer.setSize(innerWidth, innerHeight); });
window.__rig = { parts, toggle };
</script>
</body>
</html>
