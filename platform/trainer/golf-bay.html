const bonnetRig = new THREE.Group();
const bRig = {bolts:{}, struts:{}, marks:[], hinges:[], prop:null};
function buildBonnetRig(){
  const steel=new THREE.MeshStandardMaterial({color:0x7d858f,metalness:.9,roughness:.32});
  const done =new THREE.MeshStandardMaterial({color:0x34D399,metalness:.5,roughness:.4});
  for (const [k,f] of Object.entries(BFIX)){
    const g=new THREE.Group(); g.position.set(...f.p);
    const head=new THREE.Mesh(new THREE.CylinderGeometry(.026,.026,.022,6),steel);
    const shank=new THREE.Mesh(new THREE.CylinderGeometry(.011,.011,.055,10),steel);
    shank.position.y=-.034;
    g.add(head,shank); g.userData={fix:k}; bonnetRig.add(g);
    bRig.bolts[k]={g,head,shank,steel,done};
  }
  /* hinge brackets, so the bolts are visibly going into something */
  for (const x of [-.74,.74]){
    const h=new THREE.Mesh(new THREE.BoxGeometry(.075,.06,.17),steel);
    h.position.set(x,.965,1.16); bonnetRig.add(h); bRig.hinges.push(h);
  }
  for (const [k,f] of Object.entries(BSTRUT)){
    const a=new THREE.Vector3(...f.a), b=new THREE.Vector3(...f.b);
    const mid=a.clone().lerp(b,.5), len=a.distanceTo(b);
    const rod=new THREE.Mesh(new THREE.CylinderGeometry(.014,.014,len,10),steel);
    rod.position.copy(mid);
    rod.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),
      b.clone().sub(a).normalize());
    const clip=new THREE.Mesh(new THREE.TorusGeometry(.026,.008,8,14),
      new THREE.MeshStandardMaterial({color:0xF59E0B,metalness:.3,roughness:.5}));
    clip.position.copy(a); clip.userData={fix:k}; rod.userData={fix:k};
    const g=new THREE.Group(); g.add(rod,clip); bonnetRig.add(g);
    bRig.struts[k]={g,rod,clip,steel,done,a,b};
  }
  /* support — a second-person / prop-rod stand-in, so "supported" is a
     real object in the scene, not a checkbox */
  bRig.prop=new THREE.Group();
  const post=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.30,12),
    new THREE.MeshStandardMaterial({color:0xF59E0B,metalness:.4,roughness:.5}));
  post.position.y=.15;
  const pad=new THREE.Mesh(new THREE.BoxGeometry(.10,.02,.10),
    new THREE.MeshStandardMaterial({color:0x1b1e23,roughness:.9}));
  pad.position.y=.31;
  bRig.prop.add(post,pad); bRig.prop.position.set(0,.66,1.55); bRig.prop.visible=false;
  bonnetRig.add(bRig.prop);
  bonnetRig.visible=false; carRoot.add(bonnetRig);
}
function bonnetGate(act){
  if (act==='strut'||act&&act.startsWith('strut_')){
    if (!BO.looked) return 'Look the procedure up first — you do not yet know whether this bonnet carries a washer-hose clip or an electrical connector that needs disconnecting before anything moves.';
    if (!BO.supported) return 'STOP — nothing is holding the bonnet up yet. A gas strut holds it open; releasing one blind lets the unsupported side drop without warning. Support the bonnet first.';
  }
  if (act && act.startsWith('bolt')){
    if (!BO.looked) return 'Look the procedure up first, so you use the tool the data specifies rather than the one that nearly fits.';
    if (!BO.supported) return 'STOP — the bonnet still is not supported.';
    const strutsLeft=Object.keys(BSTRUT).filter(k=>!BO.strut[k]);
    if (strutsLeft.length) return `STOP — ${strutsLeft.length} gas strut${strutsLeft.length>1?'s':''} still attached. Take the hinge bolts out with a strut still fighting the hinge line and you load the bracket sideways, not down its axis — that is how a hinge bracket cracks.`;
  }
  if (act==='lift'){
    const left=Object.keys(BFIX).filter(k=>!BO.out[k]);
    if (left.length) return `${left.length} hinge bolt${left.length>1?'s':''} still in. It is not coming off.`;
  }
  return null;
}
function bonnetAct(act){
  const stop=bonnetGate(act);
  if (stop){ BO.stops++; BO.log.unshift({bad:true,t:stop}); drawPanel(); return; }
  if (act==='look'){ BO.looked=true; BO.log.unshift({t:'Procedure read. Fastener list, hidden fasteners and tool for this job are now known.'}); }
  if (act==='support'){ BO.supported=true; bRig.prop.visible=true;
    BO.log.unshift({t:'Bonnet supported independently — not relying on the struts to hold it while they are worked on.'}); }
  if (act && act.startsWith('strut_')){
    BO.strut[act]=true; const s=bRig.struts[act];
    s.rod.material=s.done; s.clip.material=s.done;
    tweenV(s.g.position,new THREE.Vector3(.10*(act==='strut_l'?-1:1),.10,0),480);
    BO.log.unshift({t:`${BSTRUT[act].label} released at the clip.`}); }
  if (act==='mark'){ BO.marked=true;
    for (const h of bRig.hinges){
      const m=new THREE.Mesh(new THREE.BoxGeometry(.10,.004,.05),
        new THREE.MeshStandardMaterial({color:0xE7ECF2,emissive:0x333333,roughness:.6}));
      m.position.set(h.position.x,h.position.y+.028,h.position.z); bonnetRig.add(m); bRig.marks.push(m);
    }
    BO.log.unshift({t:'Hinge positions marked. Without this the bonnet goes back with a shut-line gap on one side.'}); }
  if (act && act.startsWith('bolt')){
    BO.out[act]=true; const b=bRig.bolts[act];
    b.head.material=b.done; b.shank.material=b.done;
    tweenV(b.g.position,new THREE.Vector3(BFIX[act].p[0],BFIX[act].p[1]+.18,BFIX[act].p[2]),480);
    BO.log.unshift({t:`${BFIX[act].label} out.`}); }
  if (act==='lift'){ BO.off=true;
    /* the bonnet is already open — removing it is lifting the panel UP and
       FORWARD off its hinge pins, not rotating it further */
    const p=parts.panel_bonnet;
    if (p){ tweenV(p.group.position,p.home.clone().add(new THREE.Vector3(0,.34,1.00)),900); }
    BO.log.unshift({t:BO.marked
      ? 'Bonnet off, and the hinges are marked — it will line back up on refit.'
      : 'Bonnet off. You did NOT mark the hinges, so refitting is now trial and error on the shut line.'}); }
  if (act==='reset'){
    Object.assign(BO,{looked:false,supported:false,marked:false,strut:{},out:{},off:false,stops:0,log:[]});
    bRig.prop.visible=false;
    for (const k in bRig.struts){ const s=bRig.struts[k];
      s.rod.material=s.steel; s.clip.material=s.steel; s.g.position.set(0,0,0); }
    for (const k in bRig.bolts){ const b=bRig.bolts[k];
      b.head.material=b.steel; b.shank.material=b.steel; b.g.position.set(...BFIX[k].p); }
    for (const m of bRig.marks) bonnetRig.remove(m); bRig.marks.length=0;

    const p=parts.panel_bonnet;
    if(p){ p.group.rotation.x=-BONNET_OPEN; p.group.position.copy(p.home); }
  }
  drawHud(); drawPanel();
}

/* ═════════════════════════════════════════════════════════════════════
   BENCH — starting & lighting circuit, real arithmetic
   ═══════════════════════════════════════════════════════════════════ */
const FAULTS = {
  none:{l:'No fault (healthy)',h:'Everything works. Learn what good reads like before you hunt a fault.'},
  fuse_lamp:{l:'Blown lamp fuse F2',h:'Lamps dead, everything else normal.'},
  earth:{l:'Corroded earth E1',h:'Resistance in the return path. A volt-drop test finds it; a continuity beep often will not.'},
  battery:{l:'Flat battery',h:'Almost normal at rest, collapses the moment it is loaded.'},
  relay_coil:{l:'Open relay coil',h:'No click, no crank. Lights fine.'},
  feed:{l:'Open feed to relay 30',h:'Relay clicks, starter does nothing.'}};
const BEN = {fault:'none', ign:0, clutch:false, lamps:false, mode:'V', red:'B+', black:'GND', found:null};
function solve(){
  const f=BEN.fault;
  const Voc = f==='battery'?10.6:12.62, Rint = f==='battery'?.38:.012;
  /* 2.6 ohm dropped 8.23 V of a 12.6 V battery and still reported the
     lamps as lit. A badly corroded earth strap is a few tenths of an ohm;
     that gives a ~2.5 V drop, which is unmistakably a fail against the
     0.2 V rule the manual teaches, and still lets the lamps glow dimly. */
  const Re = f==='earth'?.35:.004;
  const fuseOK=f!=='fuse_lamp', coilOK=f!=='relay_coil', feedOK=f!=='feed';
  const cranking = BEN.ign===3 && BEN.clutch && coilOK;
  const lampsOn = BEN.lamps && BEN.ign>=2;
  let Vb=Voc;
  for (let k=0;k<3;k++){
    const Il=(lampsOn&&fuseOK)?Vb/(1.37+.004+Re):0;
    const Is=(cranking&&feedOK)?Vb/(.028+.003+Re):0;
    const Ic=cranking?Vb/(86+Re):0;
    Vb=Math.max(0,Voc-(Il+Is+Ic)*Rint);
  }
  const Il=(lampsOn&&fuseOK)?Vb/(1.37+.004+Re):0;
  const Is=(cranking&&feedOK)?Vb/(.028+.003+Re):0;
  const Ve=(Il+Is)*Re;
  const N={GND:0,'B-':0,E1:Ve,E2:Ve,SE:Ve,LME:Ve,'B+':Vb,F1o:Vb};
  N.K30 = feedOK?Vb:0;
  /* contacts open → 87 sits at earth through the starter winding, not floating */
  N.K87 = (cranking&&feedOK) ? Vb-Is*.003 : Ve;
  N.SB = N.K87;
  N.K85 = (BEN.ign===3&&BEN.clutch)?Vb:0;
  N.K86 = coilOK?Ve:((BEN.ign===3&&BEN.clutch)?Vb:Ve);
  N.F2i = BEN.ign>=2?Vb:0;
  N.F2o = (BEN.ign>=2&&fuseOK)?Vb:0;

}
function meterRead(){
  const r=solve();
  if (BEN.mode==='V') return {v:(r.N[BEN.red]-r.N[BEN.black]).toFixed(2),u:'V'};
  if (BEN.mode==='A'){
    const lamp=['F2o','LMP','LME'].includes(BEN.red), st=['K87','SB','SE'].includes(BEN.red);
    return {v:(lamp?r.Il:st?r.Is:0).toFixed(1),u:'A'};
  }
  if (BEN.ign!==0) return {v:'---',u:'Ω'};
  const s=new Set([BEN.red,BEN.black]);
  if (s.has('E1')&&s.has('GND')) return {v:r.Re.toFixed(2),u:'Ω'};
  if (s.has('K85')&&s.has('K86')) return {v:r.coilOK?'86.0':'OL',u:'Ω'};
  if (s.has('F2i')&&s.has('F2o')) return {v:r.fuseOK?'0.02':'OL',u:'Ω'};
  if (s.has('LMP')&&s.has('LME')) return {v:'1.37',u:'Ω'};
  return {v:'OL',u:'Ω'};
}

function pDiag(){

    </div>
    <div class="probe"><span class="dot" style="background:var(--danger)"></span>

    <div class="probe"><span class="dot" style="background:var(--ink)"></span>
      <b>BLACK</b> <span style="color:var(--ink2)">${DTP[DIAG.black].l}</span></div>
    <div class="note info" style="margin-top:8px">${rd.n}</div>
    <div class="eyebrow" style="margin-top:11px">Move the red probe</div>
    <div class="row" style="margin-top:6px">${Object.entries(DTP).map(([k,t])=>
      `<button class="btn ${DIAG.red===k?'on':''}" data-x="dgred:${k}">${t.l.split(' —')[0]}</button>`).join('')}</div>
    <div class="eyebrow" style="margin-top:9px">Move the black probe</div>

  <div class="card">
    <div class="eyebrow">Replace a part${DIAG.replaced.length?' · '+DIAG.replaced.length+' replaced':''}</div>
    <div class="row" style="margin-top:7px">

      <div class="eyebrow">Result</div>

  ${man('Training manual — how to test instead of guess',[
    '<b>Voltage is a difference, current is a flow, resistance is measured dead.</b> Every wrong reading in this bay comes from forgetting one of those: probes on the same point read zero, a resistance check on a live circuit reads nonsense, and a volt drop with no current flowing reads nothing at all.',
    '<b>A VOLT DROP is the test that finds bad joints, and it only works under load.</b> Put the meter across the joint — not across the battery — while the circuit is working hard. Under about 0.2 V across an earth or a main feed is healthy; volts across it means current is being turned into heat there. A resistance check on the same joint can read near zero and still be the fault.',

  ], true)}`;

function pAlt(){
  const r=altSolve();
  const LOAD=['Ignition only','+ headlamps','+ blower and heated screen','Everything on'];
  /* three phases 120 deg apart, and the rectified envelope over the top of
     them — the picture that makes six diodes make sense */
  const W=300,H=86,mid=H*.62,amp=26;
  const ph=p=>{let d='';
    for(let x=0;x<=W;x+=4){ const a=x/W*Math.PI*4+p*Math.PI*2/3;
      const y=mid-Math.sin(a)*amp; d+=(x?'L':'M')+x+' '+y.toFixed(1); }
    return d;};
  const rect=()=>{let d='';
    for(let x=0;x<=W;x+=3){ const a=x/W*Math.PI*4;
      let v=0; for(let p=0;p<3;p++){
        if(!ALT.diode&&p===2) continue;      /* the open diode loses a hump */
        v=Math.max(v,Math.abs(Math.sin(a+p*Math.PI*2/3))); }
      const y=mid-amp*.30-v*amp*.62; d+=(x?'L':'M')+x+' '+y.toFixed(1); }
    return d;};
  return `
  <div><div class="eyebrow">Bay 6 · Charging</div>
    <h2 style="font-size:19px;margin-top:2px">How an alternator works</h2>
    <p style="font-size:13px;color:var(--ink2);margin-top:6px">A starter turns
    electricity into rotation for a few seconds. An alternator does the opposite
    for the life of the engine — and it makes <b>AC</b>, which is why it needs six
    diodes before it can charge anything.</p></div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div class="eyebrow">Output</div>
      <span class="prov built">constructed</span></div>
    <div class="mono" id="altV" style="font-size:30px;font-weight:700;margin-top:4px;
      color:${r.lamp?'var(--danger)':'var(--good)'}">${r.V.toFixed(2)} V</div>
    <div class="note ${r.lamp?'bad':'good'}" style="margin-top:8px">
      ${r.charging
        ? (r.demand<=r.cap
          ? 'Charging. Output is regulated to about 14.4 V and the battery is being replaced faster than it is drained.'
          : `Spinning, but the load is beating it: ${Math.round(r.demand)} A wanted, ${Math.round(r.cap)} A available at this speed. The shortfall comes out of the battery and the voltage sags.`)
        : (!ALT.field
          ? 'NO FIELD. The rotor is spinning and generating nothing — no field current means no magnetism, and no magnetism means no output however fast it turns. Warning lamp on.'
          : 'Below cut-in speed. The rotor is turning too slowly to make useful voltage — at idle with everything on, this is why the lights dim.')}
    </div>
    <dl class="spec">
      <dt>engine</dt><dd>${ALT.rpm} rpm</dd>
      <dt>alternator</dt><dd>${Math.round(r.arpm)} rpm (${ALT_RATIO}:1)</dd>
      <dt>load demand</dt><dd>${Math.round(r.demand)} A</dd>
      <dt>available</dt><dd>${Math.round(r.cap)} A</dd>
      <dt>ripple</dt><dd>${r.ripple.toFixed(2)} V pk-pk</dd>
      <dt>warning lamp</dt><dd style="color:${r.lamp?'var(--danger)':'var(--good)'}">${r.lamp?'ON':'off'}</dd>
    </dl>
  </div>

  <div class="card">
    <div class="eyebrow">Three phases in, DC out</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px" role="img"
      aria-label="Three-phase AC from the stator and the rectified DC above it">
      <line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="var(--line)" stroke-width="1"/>
      ${[0,1,2].map(p=>`<path d="${ph(p)}" fill="none" stroke="${
        !ALT.diode&&p===2?'var(--danger)':'var(--ink3)'}" stroke-width="1.4" opacity="${
        r.charging?.9:.25}"/>`).join('')}
      <path d="${rect()}" fill="none" stroke="var(--good)" stroke-width="2.4"
        opacity="${r.charging?1:.2}"/>
      <text x="2" y="12" font-size="9" fill="var(--good)">rectified DC${
        !ALT.diode?' — one hump missing':''}</text>
    </svg>
    <p class="hint" style="margin-top:6px">Each stator phase peaks 120° after the last.
    Six diodes fold every half-cycle of all three into one steady DC line, so the ripple
    is small and constant. Lose one diode and a hump goes missing — the red trace — and
    the ripple you can measure on the battery jumps.</p>
  </div>

  <div class="card">
    <div class="eyebrow">Drive it</div>
    <div class="switchrow" style="border-bottom:0">
      <span>Engine speed</span><span class="mono">${ALT.rpm} rpm</span></div>
    <input type="range" min="650" max="4500" step="50" value="${ALT.rpm}" data-x="arpm">
    <div class="eyebrow" style="margin-top:10px">Electrical load</div>
    <div class="row" style="margin-top:7px">
      ${LOAD.map((l,i)=>`<button class="btn ${ALT.load===i?'on':''}" data-x="aload:${i}">${l}</button>`).join('')}
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn wide ${ALT.field?'on':''}" data-x="afield">${ALT.field?'Field ON':'Field OFF'}</button>
      <button class="btn wide ${!ALT.diode?'on':''}" data-x="adiode">${ALT.diode?'Diodes OK':'Diode FAILED'}</button>
    </div>

  ${man('Training manual — the charging system',[

    '<b>The FIELD controls the output, not the speed.</b> The rotor is an electromagnet fed a small current through two slip rings and brushes. The regulator varies that field current to hold the output near 14.4 V whatever the engine is doing. Switch the field off and a perfectly good alternator spinning at 4,000 rpm makes nothing — try it with the Field button.',
    '<b>Why the lights dim at idle.</b> Output capability rises with speed. At idle the alternator may not make enough for headlamps, blower and heated screen at once, so the shortfall comes out of the battery and system voltage sags. Raise the revs on the slider with everything switched on and watch it recover.',
    '<b>Charging voltage is not battery voltage.</b> A healthy system reads roughly 13.8–14.6 V at the battery with the engine running, and about 12.6 V with it off. A reading that stays at 12.6 V running means it is not charging; a reading much above 15 V points at the regulator. Confirm the exact figures against the data for the car in front of you.',
    '<b>Ripple is the diagnostic that finds a failed diode.</b> One open diode loses a third of the humps, so output capability drops and AC ripple on the DC line climbs. A charging system can still read a plausible voltage at idle with a failed diode and fail under load — measure ripple, or measure output current against its rating, rather than trusting one voltage reading.',
    '<b>Brushes and slip rings are the wear item.</b> They are the only sliding electrical contact in the machine. Worn brushes interrupt field current, so the symptom is intermittent charging that often comes back when you tap the casing — which is a diagnosis, not a repair.',
    '<b>Never disconnect the battery to "test" the charging system on a running engine.</b> The battery is what damps the system; removing it can spike the voltage into every electronic module on the car. Test with a meter across the battery, and follow the manufacturer\'s procedure.'
  ], true)}`;
}

    '<b>Window regulator.</b> Rails, a carrier that holds the bottom edge of the glass, and a cable drum turned by the motor. A cable jumping the drum and a cracked plastic carrier are both common and both cheaper to find than a motor, so test the motor rather than assuming it. A window that drops crooked into the door points at the carrier or the cable rather than the motor — check the glass clamps, the rails and the drive before condemning anything.',

  if(k==='do'){ doorAct(v); return; }
  if(k==='dotool'){ DO.tool=+v; drawPanel(); return; }
  if(k==='bo'){ bonnetAct(v); return; }
  if(k==='door') setDoor('door_'+v,!S.doors['door_'+v]);
  if(k==='tail') setTailgate(!S.tailgate);
  if(k==='wheel') setWheelOff('wheel_'+v,!S.wheelOff['wheel_'+v]);
  if(k==='next'){BJ.i=Math.min(JOB.length-1,BJ.i+1); JOB[BJ.i].a?.();}
  if(k==='prev'){BJ.i=Math.max(0,BJ.i-1); JOB[BJ.i].a?.();}
  if(k==='goto'){BJ.i=+v; JOB[BJ.i].a?.();}
  if(k==='ans'&&BJ.ans[BJ.i]===undefined){
    BJ.ans[BJ.i]=+v; BJ.asked++; if(+v===JOB[BJ.i].q.ok) BJ.score++;}
  if(k==='rpm') ENG.rpm=+el.value;
  if(k==='arpm') ALT.rpm=+el.value;
  if(k==='aload') ALT.load=+v;
  if(k==='afield'||k==='adiode'){act(k); return;}
  if(k==='dgstate') DIAG.state=v;
  if(k==='dgmode') DIAG.mode=v;
  if(k==='dgred'){ DIAG.red=v; paintDiagRig(); }
  if(k==='dgblack'){ DIAG.black=v; paintDiagRig(); }
  if(k==='dgdis'){ if(DIAG.disconnected[v]) delete DIAG.disconnected[v];
    else DIAG.disconnected[v]=true; }
  if(k==='dgdtc'){ DIAG.dtcRead=true;
    DIAG.log.unshift({t:'Fault codes read.'}); }
  if(k==='dgclear'){ DIAG.cleared=true; DIAG.log.unshift({t:'Fault codes cleared.'}); }
  if(k==='dgpart'){
    if(!DIAG.replaced.includes(v)){ DIAG.replaced.push(v);
      const right = v===DCASES[DIAG.caseIdx].part;
      DIAG.log.unshift({bad:!right,
        t:right?`Replaced the ${v}. The complaint is gone.`
               :`Replaced the ${v} — and the complaint is unchanged. That part was not the fault, and the customer pays for it.`}); } }
  if(k==='dgsubmit'){ DIAG.verdict='done';
    DIAG.log.unshift({t:'Job signed off.'}); }
  if(k==='dgnew'){ diagNew(); paintDiagRig(); }
  if(k==='win') DOOR.win=+el.value/100;
  if(k==='focus') ENG.focus=(+v<0?null:+v);
  if(k==='mode') BEN.mode=v;
  if(k==='ign'){BEN.ign=+v;
    if(+v===3) setTimeout(()=>{if(BEN.ign===3){BEN.ign=2;drawCircuit();drawPanel();}},2600);}
  if(k==='clutch') BEN.clutch=!BEN.clutch;
  if(k==='lamps') BEN.lamps=!BEN.lamps;
  if(k==='fault'){BEN.fault=v; BEN.found=null;}
  if(k==='random'){const ks=Object.keys(FAULTS);
    BEN.fault=ks[1+Math.floor(Math.random()*(ks.length-1))];
    BEN.found='hidden'; BEN.ign=0; BEN.lamps=false; BEN.clutch=false;}
  if(k==='guess') BEN.found=v;
  if(k==='dcard'||k==='dlatch'||k==='skey'||k==='erun'||k==='ecut'||k==='estep'){act(k); return;}
  if(MODE==='bench') drawCircuit();
  drawHud(); drawPanel();
}

/* theme */
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',
    cur ? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark'));
  applyBg(); if(MODE==='bench') drawCircuit();
});
/* THE STAGE IS ALWAYS A DARK STUDIO, whatever the UI theme is doing.
   Light theme used to set a pale floor under a pale backdrop, so the car
   had nothing to reflect and no tonal range to sit in — reported as "the
   car look faded". A photographer does not shoot a red car in a white
   room, and every car configurator keeps a dark stage behind a light UI. */
function applyBg(){
  floorMat.color.setHex(0x0a0d12);
  plinth.material.color.setHex(0x171d26);
  renderer.setClearColor(new THREE.Color(0x0a0d12), 0);
}
applyBg();

/* loop */
let last=performance.now();
const readout=document.getElementById('readout');
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  for(let i=anim.length-1;i>=0;i--) if(anim[i].tick(now)) anim.splice(i,1);
  controls.update();
  if (MODE==='bench') return;
  if (MODE==='engine'){
    engineTick(dt);
    const [n]=STROKE(ENG.angle%720);
    /* the panel is only re-rendered on interaction, so without this the
       card read "Crank 0°, cyl 1 Power" while the live readout said
       "450°, cyl 1 Intake" — two contradictory numbers on one screen */
    const cl=document.getElementById('crankLbl');
    if (cl){ cl.textContent=`Crank ${Math.round(ENG.angle)}° of 720°`;
      for(let i=0;i<4;i++){ const el=document.getElementById('cyl'+i); if(!el) continue;
        const [sn,sc]=STROKE((ENG.angle+FIRING[i])%720); el.textContent=sn; el.style.color=sc; } }
    readout.innerHTML=`<span class="mono" style="color:var(--ink);font-weight:700">${Math.round(ENG.angle)}°</span>
      · cyl 1 <b style="color:var(--ink)">${n}</b> · cam ${Math.round(ENG.angle/2)}° · ${Math.round(ENG.rpm)} rpm`;
    renderer.render(sceneRig,camera);
  } else if (MODE==='starter'){
    starterTick(dt);
    readout.innerHTML=`pinion <b style="color:var(--ink)">${ST.throwPos>.82?'meshed':'clear'}</b>
      · armature ${Math.round(ST.spin*325)} rpm · ring ${Math.round(ST.spin*325*9/44)} rpm`;
    renderer.render(sceneRig,camera);
  } else if (MODE==='alt'){
    alternatorTick(dt);
    const r=altSolve();
    readout.innerHTML=`<span class="mono" style="color:${r.lamp?'var(--danger)':'var(--good)'};
      font-weight:700">${r.V.toFixed(2)} V</span> · ${Math.round(r.arpm)} alt rpm ·
      ${r.charging?`${Math.round(Math.min(r.demand,r.cap))} A out of ${Math.round(r.cap)} A available`
        :'NOT CHARGING — running off the battery'}`;
    const vl=document.getElementById('altV');
    if (vl){ vl.textContent=r.V.toFixed(2)+' V';
      vl.style.color=r.lamp?'var(--danger)':'var(--good)'; }
    renderer.render(sceneRig,camera);
  } else if (MODE==='door'){
    doorTick(); renderer.render(sceneRig,camera);
  } else {
    renderer.render(sceneCar,camera);
  }
}
/* a read-only probe so a harness can assert on STATE, not on pixels */
window.__door = () => ({looked:DO.looked,isolated:DO.isolated,supported:DO.supported,
  loom:DO.loom,strap:DO.strap,marked:DO.marked,bolts:Object.keys(DO.out).length,
  off:DO.off,tool:DO.tool,stops:DO.stops,last:(DO.log[0]||{}).t?.slice(0,74),
  doorRotY:parts.door_fl?+parts.door_fl.group.rotation.y.toFixed(3):null,
  doorPos:parts.door_fl?[+parts.door_fl.group.position.x.toFixed(3),
    +parts.door_fl.group.position.y.toFixed(3),+parts.door_fl.group.position.z.toFixed(3)]:null,
  anims:anim.length,
  propVisible:dRig.prop?dRig.prop.visible:null});
window.__bonnet = () => ({looked:BO.looked,supported:BO.supported,marked:BO.marked,
  struts:Object.keys(BO.strut).length,bolts:Object.keys(BO.out).length,
  off:BO.off,stops:BO.stops,last:(BO.log[0]||{}).t?.slice(0,90),
  bonnetRotX:parts.panel_bonnet?+parts.panel_bonnet.group.rotation.x.toFixed(3):null,
  bonnetPos:parts.panel_bonnet?[+parts.panel_bonnet.group.position.x.toFixed(3),
    +parts.panel_bonnet.group.position.y.toFixed(3),+parts.panel_bonnet.group.position.z.toFixed(3)]:null,
  anims:anim.length,
  propVisible:bRig.prop?bRig.prop.visible:null});
window.__diag = () => { const m=diagPhys(), rd=diagRead();
  return {fault:DIAG.fault, state:DIAG.state, mode:DIAG.mode,
    red:DIAG.red, black:DIAG.black, reading:rd.v+' '+rd.u,
    vbat:+m.vbat.toFixed(2), drop:+m.drop.toFixed(2), altOut:+m.altOut.toFixed(2),
    ripple:+m.ripple.toFixed(2), spins:m.spins, runnable:m.runnable,
    replaced:[...DIAG.replaced], dis:Object.keys(DIAG.disconnected),
    cleared:DIAG.cleared, verdict:DIAG.verdict, points:Object.keys(DTP).length,
    rigVisible:diagRig.visible}; };
window.__setDiag = o => { Object.assign(DIAG,o); paintDiagRig(); drawHud(); drawPanel(); };
window.__alt = () => { const r=altSolve();
  return {rpm:ALT.rpm,field:ALT.field,diode:ALT.diode,load:ALT.load,
    altRpm:Math.round(r.arpm),charging:r.charging,V:+r.V.toFixed(2),
    demand:Math.round(r.demand),cap:Math.round(r.cap),
    ripple:+r.ripple.toFixed(2),lamp:r.lamp,visible:altAsm.visible}; };
/* a harness must be able to drive it without clicking a range input */
window.__setAlt = o => { Object.assign(ALT,o); drawHud(); drawPanel(); };
window.__bay = () => ({visible:bayAsm.visible, on:BAY.engine,
  meshes:bayAsm.children.length,
  altInBay:!!bP.alt, bonnetRotX:parts.panel_bonnet
    ?+parts.panel_bonnet.group.rotation.x.toFixed(3):null});
window.__meshNames = () => { const o=[]; carRoot.traverse(m=>{ if(m.isMesh && o.length<8)
    o.push({name:m.name, cls:m.userData.partId}); }); return o; };
window.__dbg = () => ({
  doors:{...S.doors}, wheels:{...S.wheelOff}, xray:S.xray, explode:S.explode, mode:MODE,
  rotFL: parts.door_fl ? +parts.door_fl.group.rotation.y.toFixed(4) : null,
  rotTail: parts.tailgate ? +parts.tailgate.group.rotation.x.toFixed(4) : null,
  posWheelFL: parts.wheel_fl ? +parts.wheel_fl.group.position.x.toFixed(4) : null,
  partIds: Object.keys(parts).length, anims: anim.length});
resize(); requestAnimationFrame(frame);
setMode('strip');
</script>
