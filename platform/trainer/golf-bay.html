<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strip Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
/* ── tokens ───────────────────────────────────────────────────────────
   Dark-first: a workshop bay under lamps. Light is redefined twice so
   all three viewer states resolve (explicit dark, explicit light, and
   the un-stamped system default). */
:root{
  --bay:#0E1116; --panel:#151A21; --panel2:#1C232C; --panel3:#232C37;
  --line:#28313C; --ink:#E7ECF2; --ink2:#97A3B2; --ink3:#64717F;
  --pri:#3B82F6; --pri2:#60A5FA;
  --warn:#F59E0B; --danger:#EF4444; --good:#34D399;
  --floor:0x0E1116; --r:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bay:#EDEEF1; --panel:#FFFFFF; --panel2:#F5F6F8; --panel3:#EAECEF;
    --line:#D7DBE0; --ink:#14181D; --ink2:#586472; --ink3:#87919E;
    --pri:#1D5FD0; --pri2:#1748A8;
    --warn:#96620A; --danger:#C22B2B; --good:#0F7A55;
  }
}
:root[data-theme="light"]{
  --bay:#EDEEF1; --panel:#FFFFFF; --panel2:#F5F6F8; --panel3:#EAECEF;
  --line:#D7DBE0; --ink:#14181D; --ink2:#586472; --ink3:#87919E;
  --pri:#1D5FD0; --pri2:#1748A8;
  --warn:#96620A; --danger:#C22B2B; --good:#0F7A55;
}

*{box-sizing:border-box}
/* GRID/FLEX BLOWOUT GUARD. A grid or flex item defaults to min-width:auto,
   so any child with a wide min-content contribution makes the track wider
   than the viewport — the page then lays out wider than the screen and the
   panel text is CLIPPED at the right edge rather than wrapping. That is
   what "it don't fit on page" looked like on a 390px phone: the media
   query had fired and the panel had moved below the stage, and the text
   was still cut off mid-word. Every container in the chain needs an
   explicit minimum of zero. Measured with scrollWidth vs innerWidth, not
   judged by eye. */
html,body{max-width:100%;overflow-x:hidden}
/* An explicit `display` on an element BEATS the UA stylesheet's
   [hidden]{display:none}, because #loading{display:grid} is the stronger
   selector. Without this line the loading overlay never disappears and the
   whole app sits behind it forever — found in a real browser, invisible in
   the source. Anything toggled with .hidden needs this guard. */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--bay); color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.02em; text-wrap:balance}
.mono{font-family:"Roboto Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
:focus-visible{outline:2px solid var(--pri); outline-offset:2px; border-radius:4px}

/* max-height as well as height: inside an artifact iframe the frame can be
   shorter than the dvh the page computes, and without the cap the grid's
   1fr row overflows and the whole app reads as "does not fit on the page". */
#shell{display:grid; grid-template-rows:auto 1fr; grid-template-columns:minmax(0,1fr);
  height:100dvh; max-height:100dvh; min-height:0; overflow:hidden}
#shell > *{min-width:0}
header{display:flex; align-items:center; gap:13px; padding:10px 16px; flex-wrap:wrap;
  min-width:0; border-bottom:1px solid var(--line); background:var(--panel)}
.mark{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;
  background:var(--pri);color:#fff;font-weight:800;font-size:13px;letter-spacing:-.04em}
.brand b{font-size:16.5px;font-weight:800;letter-spacing:-.03em}
.brand .sub{font-size:11px;color:var(--ink3);white-space:nowrap}
.brand{display:flex;align-items:baseline;gap:9px}
/* EIGHT bays now. In one header row on a narrow screen the last tabs are
   pushed off the edge, and with the scrollbar hidden there is nothing to
   say they are there — the trainee simply cannot reach Bonnet off or Bench.
   So: the strip still scrolls (with momentum on iOS), it carries a fade at
   whichever edge has more to show, and under 760px it takes a full-width
   row of its own instead of competing with the brand and the theme button. */
nav#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;
  min-width:0;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
  padding-inline:2px}
nav#tabs::-webkit-scrollbar{display:none}
@media (max-width:760px){
  header{gap:8px 10px;padding:9px 12px}
  nav#tabs{flex:1 0 100%;order:3;margin-top:1px}
  .brand{flex:1 1 auto;min-width:0}
  .brand b{font-size:15px}
}
.tab{padding:7px 12px;border-radius:7px;white-space:nowrap;font-size:13px;font-weight:600;color:var(--ink2);
  flex:none}
.tab:hover{background:var(--panel2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--pri);color:#fff}
.iconbtn{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--ink2);font-size:14px}
.iconbtn:hover{color:var(--ink);border-color:var(--ink3)}

#work{display:grid;grid-template-columns:minmax(0,1fr) 348px;min-height:0;min-width:0}
#work > *{min-width:0}
/* Fixed dark studio backdrop — deliberately NOT themed, see applyBg(). */
#stage{position:relative;min-width:0;background:
  radial-gradient(115% 80% at 50% 0%, #1b2430 0%, #11161e 45%, #080a0e 100%)}
#stage canvas{display:block;width:100%;height:100%}
#bench-stage{position:absolute;inset:0;overflow:auto;padding:16px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;
  overflow-x:hidden;min-width:0;
  overscroll-behavior:contain;padding:16px;display:flex;flex-direction:column;gap:13px}
aside > *{min-width:0;max-width:100%}
@media (max-width:900px){
  body{font-size:14px}
  #work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(230px,42dvh) 1fr}
  aside{border-left:0;border-top:1px solid var(--line);padding:14px 16px 34px}
  .brand .sub{display:none}
}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);padding:12px;
  min-width:0;max-width:100%}
.card h3{font-size:14px;margin-bottom:5px}
.card p{margin:0;font-size:13px;color:var(--ink2);line-height:1.55;overflow-wrap:anywhere}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  font-size:12.5px;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.wide{flex:1 1 auto;text-align:center}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:transparent}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:12.5px}
dl.spec dt{color:var(--ink3)}
dl.spec dd{margin:0;text-align:right;font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--ink3);line-height:1.5}
.note{border-left:3px solid var(--warn);padding:8px 10px;border-radius:0 7px 7px 0;
  background:color-mix(in srgb,var(--warn) 11%,transparent);font-size:12.5px;line-height:1.55}
.note.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 11%,transparent)}
.note.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.note.info{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 11%,transparent)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.switchrow:last-child{border-bottom:0}
input[type=range]{width:100%;accent-color:var(--pri)}

/* provenance marker — every part says whether it is real or constructed */
.prov{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.prov.real{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.prov.built{background:color-mix(in srgb,var(--pri) 18%,transparent);color:var(--pri2)}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.badge.tool{background:color-mix(in srgb,var(--pri) 18%,transparent);color:var(--pri2)}
.badge.torque{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* training manual */
.manual{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.manual > summary{padding:11px 12px;cursor:pointer;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:space-between;background:var(--panel3)}
.manual > summary::-webkit-details-marker{display:none}
.manual > summary::after{content:"＋";color:var(--ink3);font-weight:400}
.manual[open] > summary::after{content:"−"}
.manual .body{padding:12px}
ol.man{list-style:none;margin:0;padding:0;counter-reset:m;display:flex;flex-direction:column;gap:10px}
/* Each ELEMENT child of a grid container is its own grid item, so a bare
   <b> plus a trailing text node made three items in a two-column grid and
   the prose wrapped one word per line. The item text is wrapped in a single
   <span> in man() so there is exactly one item beside ::before. */
ol.man li{counter-increment:m;display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:12.5px;
  color:var(--ink2);line-height:1.55}
ol.man li > span{min-width:0}
ol.man li::before{content:counter(m,decimal-leading-zero);font-family:"Roboto Mono",monospace;
  font-size:10.5px;font-weight:700;color:var(--pri2);padding-top:2px}
ol.man li b{color:var(--ink);font-weight:700}

ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
ol.steps li{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:start;
  padding:7px 8px;border-radius:8px;font-size:12.5px;color:var(--ink3);cursor:pointer}
ol.steps li .n{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  border:1px solid var(--line);font-size:11px;font-weight:700;font-family:"Roboto Mono",monospace}
ol.steps li.done{color:var(--ink2)}
ol.steps li.done .n{background:var(--good);border-color:var(--good);color:#06281C}
ol.steps li.now{background:var(--panel3);color:var(--ink);font-weight:600}
ol.steps li.now .n{background:var(--pri);border-color:var(--pri);color:#fff}
.choice{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);font-size:12.5px;margin-bottom:6px}
.choice:hover{border-color:var(--ink3)}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.choice.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent)}

#hud{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;
  max-width:calc(100% - 24px);pointer-events:none}
#hud > *{pointer-events:auto}
.chip{padding:6px 10px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--ink2);
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);
  backdrop-filter:blur(8px)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
#caption{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--ink3);
  background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--line);
  padding:5px 9px;border-radius:7px;backdrop-filter:blur(8px);max-width:calc(100% - 24px)}
#readout{position:absolute;right:12px;bottom:12px;padding:8px 11px;border-radius:8px;
  background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);
  backdrop-filter:blur(8px);font-size:11.5px;color:var(--ink2);max-width:58%}
#loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:24px;background:var(--bay);z-index:5}
#loading .bar{width:min(260px,70vw);height:3px;border-radius:2px;background:var(--line);
  overflow:hidden;margin:12px auto 0}
#loading .bar i{display:block;height:100%;width:0%;background:var(--pri);transition:width .25s}

#circuit{width:100%;height:auto;max-width:760px;margin:0 auto;display:block}
#circuit text{font-family:"Roboto Mono",monospace;font-size:11px;fill:var(--ink2)}
#circuit .wire{stroke:var(--ink3);stroke-width:2.2;fill:none;stroke-linecap:round}
#circuit .wire.live{stroke:var(--danger);stroke-width:2.8}
#circuit .wire.dead{stroke:var(--line)}
#circuit .box{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
#circuit .tp{fill:var(--panel);stroke:var(--ink3);stroke-width:1.6;cursor:pointer}
#circuit .tp:hover{stroke:var(--ink);fill:var(--panel3)}
#circuit .tp.red{fill:var(--danger);stroke:var(--danger)}
#circuit .tp.black{fill:var(--ink);stroke:var(--ink)}
.meter{border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);padding:12px}
.meter .screen{background:#08120D;border:1px solid var(--line);border-radius:7px;padding:12px 14px;
  font-family:"Roboto Mono",monospace;color:#5BE08A;text-align:right;font-size:25px;font-weight:700;
  text-shadow:0 0 12px rgba(91,224,138,.3)}
.meter .screen small{display:block;font-size:10px;color:#3E8F5C;letter-spacing:.1em;text-align:left;text-shadow:none}
.probe{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0}
.probe .dot{width:11px;height:11px;border-radius:50%;flex:none}
.probe .dot.r{background:var(--danger)} .probe .dot.b{background:var(--ink)}
.probe .val{margin-left:auto;font-family:"Roboto Mono",monospace;color:var(--ink3)}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="mark">SB</div>
    <div class="brand"><b>Strip Bay</b><span class="sub">Golf Mk8 GTI · teardown trainer</span></div>
    <nav id="tabs" role="tablist"></nav>
    <button class="iconbtn" id="themeBtn" title="Light / dark" aria-label="Toggle light and dark">◐</button>
  </header>
  <div id="work">
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="bench-stage" hidden></div>
      <div id="hud"></div>
      <div id="caption" hidden></div>
      <div id="readout" hidden></div>
      <div id="loading"><div>
        <div class="eyebrow">Loading the car</div>
        <div class="mono" id="loadPct" style="font-size:28px;font-weight:700;margin-top:4px">0%</div>
        <div class="bar"><i id="loadBar"></i></div>
        <div class="hint" style="margin-top:10px;max-width:300px">
          6.6 MB · 543,082 triangles · 164 separately named parts</div>
      </div></div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>

<!-- three.js r169 is served from alongside this page, not from a CDN. Six
     files, 1.5 MB, and the import graph is closed — every import inside them
     resolves to "three" or a sibling file. Nothing here reaches the network
     except golf.glb, so the app cannot be broken by a CDN or a blocked fetch. -->
<script type="importmap">
{"imports":{
  "three":"./lib/three.module.js",
  "three/addons/":"./lib/addons/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ═════════════════════════════════════════════════════════════════════
   MEASURED FACTS — read off this exact GLB (node tree walked, accessors
   decoded). Frame: +X is the car's LEFT, +Y up, +Z the nose, ground Y=0.
   ═══════════════════════════════════════════════════════════════════ */
const CAR = {length:4.295, width:2.094, height:1.489,
  axleY:0.315, axleZf:1.3157, axleZr:-1.3157, trackX:0.764,
  rimR:0.2510, tyreR:0.3288, discR:0.1708, discInner:0.1027,
  discThick:0.0309, boltR:0.056, hubX:0.858};
const HINGE = {
  door_fl:{x: 0.772,y:0,z: 0.870}, door_fr:{x:-0.772,y:0,z: 0.870},
  door_rl:{x: 0.754,y:0,z:-0.209}, door_rr:{x:-0.754,y:0,z:-0.209},
  tailgate:{x:0,y:1.394,z:-1.472},
  /* Bonnet hinge line, measured by panel_cut.py off the cut panel itself
     (hinge y=0.975 z=1.115, axis=X) — not guessed, printed by the tool
     that made the cut. x=0 is irrelevant to an X-axis rotation, same as
     the doors' unused y. */
  panel_bonnet:{x:0,y:0.975,z:1.115}};
const RULES = [
  /* panel_cut.py's own node, appended outside the "G:"-prefixed naming
     convention every sourced mesh uses — must be matched before the
     catch-all, or it silently falls into 'body' again. */
  [/^Panel_Bonnet/,'panel_bonnet'],
  [/^Ext_Door_FL_|^Int_Door_FL_|^Ext_Door_Limiter_FL/,'door_fl'],
  [/^Ext_Door_FR_|^Int_Door_FR_|^Ext_Door_Limiter_FR/,'door_fr'],
  [/^Ext_Door_RL_|^Int_Door_RL_|^Ext_Door_Limiter_RL/,'door_rl'],
  [/^Ext_Door_RR_|^Int_Door_RR_|^Ext_Door_Limiter_RR/,'door_rr'],
  [/^Ext_Trunk_Lid|^Int_Trunk_Lid/,'tailgate'],
  [/^Rim_FL|^Tire_FL/,'wheel_fl'],[/^Rim_FR|^Tire_FR/,'wheel_fr'],
  [/^Rim_RL|^Tire_RL/,'wheel_rl'],[/^Rim_RR|^Tire_RR/,'wheel_rr'],
  [/^Ext_Brake_FL_Rotor/,'rotor_fl'],[/^Ext_Brake_FR_Rotor/,'rotor_fr'],
  [/^Ext_Brake_FL_Caliper/,'caliper_fl'],[/^Ext_Brake_FR/,'caliper_fr'],
  [/^Ext_Brake_Rear/,'brakes_rear'],
  [/^Int_Airbag/,'airbags'],[/^Int_Seats|^seat_/,'seats'],[/^Int_SW/,'steering'],
  [/^Ext_Sunroof/,'sunroof'],[/^Ext_Lights/,'lamps_front'],[/^Ext_Taillight/,'lamps_rear'],
  [/^Ext_Window|^Int_Window|^Int_Body_Window|^Ext_Body_Window|^Int_Glass_Clear/,'glazing'],
  [/^Int_/,'cabin'],[/./,'body']];

const PART = {
  body:{l:'Body shell',g:'Body',n:'Wings, roof and <b>both bumpers</b> are still part of this single welded mesh — they are not separate panels in this file, so they cannot be taken off here. The <b>bonnet</b> used to be part of this shell too; it has been cut out along its real shut line (a crease-bounded region grow, verified as one connected hole-free surface patch) and is now its own part — see <b>Bonnet off</b>.'},
  panel_bonnet:{l:'Bonnet',g:'Body',n:'Cut out of the body shell along its own shut line — the POSITION, NORMAL and TEXCOORD data are shared byte-for-byte with the shell it came from, so nothing was remodelled or moved. Hinged at the scuttle, just ahead of the windscreen. The <b>Bonnet off</b> bay takes it off with real hinge bolts and gas struts.'},
  door_fl:{l:'Door — front left',g:'Body',n:'Outer skin, inner frame, door card, speaker, glass and check strap, all moving together. Hinged at the A-pillar. The <b>Inside a door</b> bay opens this one up.'},
  door_fr:{l:'Door — front right',g:'Body',n:'Same assembly mirrored. The steering wheel on this car is on the LEFT, so this is the passenger door.'},
  door_rl:{l:'Door — rear left',g:'Body',n:'Shorter skin, hinged at the B-pillar. The check strap is what stops it swinging into the car next to you.'},
  door_rr:{l:'Door — rear right',g:'Body',n:'Rear doors carry their own card, fabric insert and two speakers.'},
  tailgate:{l:'Tailgate',g:'Body',n:'Hinged at the roof. The gooseneck hinge arms are modelled — they are what swings down into the load space as the lid rises.'},
  wheel_fl:{l:'Wheel — front left',g:'Chassis',n:'19-inch rim, tyre as its own mesh. Five bolts on a 112 mm circle. Measured rim radius 251 mm, tyre 329 mm.'},
  wheel_fr:{l:'Wheel — front right',g:'Chassis',n:'Front wheels steer and take most of the braking, so front pads wear two to three times faster than the rears.'},
  wheel_rl:{l:'Wheel — rear left',g:'Chassis',n:'Rear wheel and tyre.'},
  wheel_rr:{l:'Wheel — rear right',g:'Chassis',n:'Rear wheel and tyre.'},
  rotor_fl:{l:'Brake disc — FL',g:'Chassis',n:'Vented front disc, 342 mm across and 31 mm thick as modelled. Discs wear too — measure the thickness, never just look at it.'},
  rotor_fr:{l:'Brake disc — FR',g:'Chassis',n:'Replace discs in axle pairs, never one side on its own.'},
  caliper_fl:{l:'Brake caliper — FL',g:'Chassis',n:'Sliding caliper, ahead of the axle on this model. Holds the pads and the piston that squeezes them.'},
  caliper_fr:{l:'Brake caliper — FR',g:'Chassis',n:'Never let a caliper hang on its flexible hose — support it or you wreck the hose lining.'},
  brakes_rear:{l:'Rear brakes',g:'Chassis',n:'Rear discs and calipers are modelled as one left-and-right mesh, so this pair cannot be split individually. The brake job uses a front corner.'},
  seats:{l:'Seats',g:'Interior',n:'Front buckets and rear bench across 14 meshes — main body, bolsters, piping, stitching, headrests. 89,355 triangles.'},
  steering:{l:'Steering wheel',g:'Interior',n:'On the LEFT of the cabin. This asset is left-hand drive; a UK car has it on the right.'},

/* ═════════════════════════════════════════════════════════════════════
   RENDERER — one canvas, one camera. sceneCar holds the real Golf;
   sceneRig holds the constructed assemblies on a plinth.
   ═══════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
/* CONTACT SHADOWS. Without them the car floats on the floor and everything
   reads flat — the single biggest reason the owner said "the car look
   faded". Soft PCF, one shadow-casting key light, tight ortho frustum so
   the limited map resolution is spent on the car and not on empty floor. */
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const pmrem = new THREE.PMREMGenerator(renderer);

/* ── STUDIO ENVIRONMENT ───────────────────────────────────────────────
   RoomEnvironment is a neutral grey box: it lights everything evenly from
   everywhere, which is exactly what makes car paint look like matte
   plastic. What gives a car render its look is BRIGHT SOURCES ON A DARK
   ROOM — long specular streaks along the flanks and a hard edge on the
   shoulder line. So the environment is built here: a dark shell with one
   big overhead softbox, two tall side strips down each flank, and a dim
   warm bounce low down. Same trick a photographer uses on a real car. */
function studioEnv(){
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x05070a);
  const lamp = (w,h,d,x,y,z,c,i)=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
      new THREE.MeshBasicMaterial({color:c}));
    m.material.color.multiplyScalar(i); m.position.set(x,y,z); s.add(m);
  };
  /* the room: dark, so reflections have somewhere black to fall */
  const shell = new THREE.Mesh(new THREE.BoxGeometry(32,18,32),
    new THREE.MeshBasicMaterial({color:0x0b0f14, side:THREE.BackSide}));
  s.add(shell);
  lamp(16,.4,10,  0, 8.6,  0, 0xffffff, 5.4);   /* overhead softbox */
  lamp(.4,5.5,20, 11, 4.2,  0, 0xfff3e2, 3.4);  /* right flank strip */
  lamp(.4,5.5,20,-11, 4.2,  0, 0xe8f1ff, 2.9);  /* left flank strip */
  lamp(9,.4,.4,   0, 1.1,  12, 0xffffff, 1.5);  /* front kicker */
  lamp(9,.4,.4,   0, 1.1, -12, 0xdfe8f5, 1.1);  /* rear rim light */
  lamp(20,.4,20,  0,-3.0,  0, 0x2a2f38, 1.0);   /* dim floor bounce */
  return s;
}
const envRT = pmrem.fromScene(studioEnv(), 0.035);

const sceneCar = new THREE.Scene(), sceneRig = new THREE.Scene();
sceneCar.environment = envRT.texture; sceneRig.environment = envRT.texture;
const camera = new THREE.PerspectiveCamera(38,1,0.02,200);
camera.position.set(5.2,2.3,6.4);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.target.set(0,.72,0); controls.minDistance = .35; controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI*.495;
/* Lighting now sits UNDER the environment rather than replacing it: a hard
   key for the shadow and the shoulder highlight, a cool low fill so the
   dark side is not black, and almost no ambient — ambient light is what
   flattens a render. */
for (const s of [sceneCar, sceneRig]){
  const k = new THREE.DirectionalLight(0xffffff, 2.3); k.position.set(4.5,7.5,5.5);
  k.castShadow = true;
  k.shadow.mapSize.set(2048,2048);
  const d = 4.2;                          /* tight around a 4.3m car */
  Object.assign(k.shadow.camera,{left:-d,right:d,top:d,bottom:-d,near:.5,far:26});
  k.shadow.bias = -0.0012; k.shadow.normalBias = 0.02;
  /* The fill and rim lights sat LOW (y 2.4 and 1.6), so they grazed the
     floor and lit it to luma 155 on one side against 69 on the other —
     measured, not eyeballed. Raised so they hit the car's flanks and
     shoulders instead of skimming the ground. */
  const f = new THREE.DirectionalLight(0xbfd4ff,.42); f.position.set(-6,4.6,-4);
  const r = new THREE.DirectionalLight(0xffe9cf,.50); r.position.set(-2,3.8,-7);
  s.add(k,f,r,new THREE.AmbientLight(0xffffff,.10));
}
/* A dark, slightly glossy floor. Matte near-black read as a flat void; a
   little reflectivity puts the car's own colour back under it, which is
   what makes a studio shot feel like a studio. */
/* Reflective enough to catch the car's colour, NOT enough to mirror the
   overhead softbox — at metalness .30 / roughness .42 the floor came back
   as a white sweep across half the frame and swallowed the contact shadow
   it exists to show. envMapIntensity is the real lever here. */
const floorMat = new THREE.MeshStandardMaterial({color:0x06080b,roughness:.82,metalness:.02});
floorMat.envMapIntensity = 0.05;
const floor = new THREE.Mesh(new THREE.CircleGeometry(11,80), floorMat);
floor.rotation.x = -Math.PI/2; floor.position.y = -.002; floor.receiveShadow = true;
sceneCar.add(floor);
const rigFloor = new THREE.Mesh(new THREE.CircleGeometry(4,64), floorMat);
rigFloor.rotation.x = -Math.PI/2; rigFloor.position.y = -.06; rigFloor.receiveShadow = true;
sceneRig.add(rigFloor);
const grid = new THREE.GridHelper(18,36,0x2c3541,0x1f2732);
grid.material.transparent = true; grid.material.opacity = .30; grid.position.y = .001;
sceneCar.add(grid);
/* plinth for the constructed assemblies — their own demos sit on one */
const plinth = new THREE.Mesh(new THREE.BoxGeometry(2.4,.05,1.8),
  new THREE.MeshStandardMaterial({color:0x2a3a52,roughness:.55,metalness:.1}));
plinth.position.y = -.026; sceneRig.add(plinth);

function resize(){
  const r = canvas.parentElement.getBoundingClientRect();
  if (!r.width || !r.height) return;
  renderer.setSize(r.width,r.height,false);
  camera.aspect = r.width/r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);

/* ── tweens ─────────────────────────────────────────────────────── */
const anim = [];
const ease = k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
function tween(o,p,to,ms=560,done){
  const from=o[p], t0=performance.now();
  anim.push({tick(n){const k=Math.min(1,(n-t0)/ms); o[p]=from+(to-from)*ease(k);
    if(k>=1){done?.();return true} return false}});
}
function tweenV(v,to,ms=560,done){
  const from=v.clone(), t0=performance.now();
  anim.push({tick(n){const k=Math.min(1,(n-t0)/ms); v.lerpVectors(from,to,ease(k));
    if(k>=1){done?.();return true} return false}});
}
function flyTo(t,p,ms=900){ tweenV(controls.target,t,ms); tweenV(camera.position,p,ms); }

/* ═════════════════════════════════════════════════════════════════════
   THE REAL CAR
   ═══════════════════════════════════════════════════════════════════ */
const carRoot = new THREE.Group(); sceneCar.add(carRoot);
const parts = {}; let carReady=false, loadFailed=false;
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
/* Published as .glb.wasm, not .glb. Artifact hosting serves a fixed set of
   extensions and .glb is not one of them, under any content type — while
   .wasm is served and is binary-safe. GLTFLoader fetches an ArrayBuffer and
   identifies the file by its "glTF" magic bytes, so the extension and the
   MIME type are irrelevant to parsing. Same file, byte for byte. */
loader.load('golf.glb.wasm', g => buildCar(g.scene),
  /* A server that sends no Content-Length gives e.total = 0. Reporting the
     bytes actually received beats a progress bar frozen at 0%, which reads
     as a hang when the download is fine. */
  e => { const el=document.getElementById('loadPct');
    if (e.total){ const p=Math.round(e.loaded/e.total*100);
      el.textContent=p+'%'; document.getElementById('loadBar').style.width=p+'%'; }
    else el.textContent=(e.loaded/1048576).toFixed(1)+' MB'; },
  () => { loadFailed = true;
    document.getElementById('loading').innerHTML =
      `<div style="max-width:380px"><div class="eyebrow" style="color:var(--danger)">Car asset not loaded</div>
       <p style="color:var(--ink2);font-size:13px;margin-top:8px"><code class="mono">golf.glb</code> did not
       load, so the bays that use the real car are unavailable. <b>Inside a door</b>, <b>Starter</b>,
       <b>Engine</b> and <b>Bench</b> are built in code and still work — pick one above.</p></div>`; });

/* NAME-SPACE MISMATCH, and it silently collapsed the whole car into one part.
   The GLB names every node "G:Ext_Door_FL_…". three.js runs node names through
   PropertyBinding.sanitizeNodeName, which DELETES reserved characters rather
   than substituting them — so the colon vanishes and the mesh arrives called
   "GExt_Door_FL_…". A test for a leading "G:" never fires, every rule misses,
   and the catch-all [/./,'body'] swallows all 163 meshes. partIds read 1
   instead of 24, so every door/wheel/brake action hit `if(!p) return` and did
   nothing at all — with no error anywhere. Match against the raw name AND both
   de-prefixed forms, rules in priority order. */
const classify = n => {
  const cands = [n];
  if (n.startsWith('G:')) cands.push(n.slice(2));
  if (/^G[A-Z]/.test(n)) cands.push(n.slice(1));
  for (const [re,id] of RULES) for (const c of cands) if (re.test(c)) return id;
  return 'body';
};
function buildCar(root){
  carRoot.add(root); carRoot.updateMatrixWorld(true);
  const by = {};
  root.traverse(o => {
    if (!o.isMesh) return;
    /* clone the material per mesh. The GLB shares one `Atlas` and one
       `CarPaint` across dozens of parts, so without this a highlight or
       an x-ray on the body would silently change every door too. */
    if (o.material) o.material = o.material.clone();
    o.userData.partId = classify(o.name || o.parent?.name || '');
    /* shadows, and a little more environment in the paint. The GLB's own
       material values are untouched apart from envMapIntensity, which is a
       RENDER setting rather than an asset property — it controls how much
       of the studio the surface reflects, and at 1.0 against a dark studio
       the body read flat. Glass is left alone so it keeps refracting.
       NOTE partId must be classified BEFORE this runs, or the glazing test
       reads undefined and the windows get boosted too. */
    o.castShadow = true; o.receiveShadow = true;
    if (o.material && o.material.envMapIntensity !== undefined
        && o.userData.partId !== 'glazing'){
      o.material.envMapIntensity = 1.45;
    }
    (by[o.userData.partId] ||= []).push(o);
    if (o.material) o.userData.m0 = {transparent:o.material.transparent,
      opacity:o.material.opacity, depthWrite:o.material.depthWrite};
  });
  for (const id in by){
    const meshes = by[id], box = new THREE.Box3();
    for (const m of meshes) box.expandByObject(m);
    const c = box.getCenter(new THREE.Vector3());
    const pv = HINGE[id] ? new THREE.Vector3(HINGE[id].x,HINGE[id].y,HINGE[id].z) : c;
    const g = new THREE.Group(); g.position.copy(pv); carRoot.add(g);
    for (const m of meshes) g.attach(m);
    let dir = c.clone().sub(new THREE.Vector3(0,.7,0));
    dir = dir.lengthSq() < 1e-8 ? new THREE.Vector3(0,1,0) : dir.normalize();
    const tris = meshes.reduce((s,m)=>s+(m.geometry.index?m.geometry.index.count
      :m.geometry.attributes.position.count)/3,0);
    parts[id] = {meshes,group:g,home:pv.clone(),centre:c,box,dir,tris:Math.round(tris)};
  }
  /* A single bucket means classification failed. It is not a cosmetic
     problem — nothing can be taken apart — so say so rather than render a
     car that quietly refuses to come apart. */
  const nParts = Object.keys(parts).length;
  if (nParts < 10){
    console.error(`Strip Bay: only ${nParts} part group(s) from ${root.children.length}`+
      ` nodes — part classification failed, nothing will come apart.`);
    document.getElementById('caption').textContent =
      `WARNING: ${nParts} part group(s) recognised — teardown disabled`;
  }
  buildDoorRig();
  if (!parts.panel_bonnet) console.error('Strip Bay: panel_bonnet not found — '+
    'the cut panel did not classify. Bonnet off bay will have nothing to act on.');
  buildBonnetRig(); buildBayEngine(); buildDiagRig();
  carReady = true; window.__carReady = true;   /* a harness can wait on the truth */
  buildPads(); setMode(MODE);
}

/* ── constructed brake pads ──────────────────────────────────────────
   The GLB has a disc and a caliper and NO PADS. These are built from the
   measured disc and caliper geometry, and flagged as constructed. */
const padGroup = new THREE.Group(); const padSide = {};
function padGeo(){
  const rI = CAR.discInner+.004, rO = CAR.discR-.004, a = THREE.MathUtils.degToRad(58);
  const s = new THREE.Shape();
  /* arc centred on shape-angle 180°, because rotateY(+90°) maps shape −X
     onto world +Z — and +Z from the axle is where the caliper sits. */
  s.absarc(0,0,rO, Math.PI-a/2, Math.PI+a/2, false);
  s.absarc(0,0,rI, Math.PI+a/2, Math.PI-a/2, true);
  const g = new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false});
  g.rotateY(Math.PI/2);            /* extrude axis → world +X (the axle) */
  return g;
}
function buildPads(){
  if (!parts.rotor_fl) return;
  const ax = new THREE.Vector3(CAR.trackX,CAR.axleY,CAR.axleZf);
  const fric = new THREE.MeshStandardMaterial({color:0x3A3D42,roughness:.9,metalness:.05});
  const back = new THREE.MeshStandardMaterial({color:0x8A8F98,roughness:.42,metalness:.85});
  for (const side of ['outer','inner']){
    const sgn = side==='outer' ? 1 : -1, grp = new THREE.Group();
    const f = new THREE.Mesh(padGeo(), fric.clone());
    const b = new THREE.Mesh(padGeo(), back);
    grp.add(f,b); grp.position.copy(ax); padGroup.add(grp);
    padSide[side] = {grp,f,b,sgn};
  }
  padGroup.visible = false; carRoot.add(padGroup); setPadWear(12);
}
function setPadWear(mm){
  const gap = CAR.discThick/2 + .0006, t = mm/1000, bt = .005;
  for (const side in padSide){
    const {f,b,sgn} = padSide[side];
    f.scale.x = t; b.scale.x = bt;
    /* geometry runs 0→+1 in x before scaling, so a −X pad is offset by
       its own thickness to keep its face against the disc */
    f.position.x = sgn>0 ? gap : -(gap+t);
    b.position.x = sgn>0 ? gap+t : -(gap+t+bt);
    f.material.color.setHex(mm<4 ? 0x5A2222 : 0x3A3D42);
  }
}

/* ── car actions ────────────────────────────────────────────────── */
const S = {doors:{}, tailgate:0, xray:false, explode:0, wheelOff:{}, iso:null};
const DOOR_OPEN = THREE.MathUtils.degToRad(64);
function setDoor(id,open){
  const p=parts[id]; if(!p) return;
  S.doors[id]=open?1:0;
  tween(p.group.rotation,'y', open ? (id.endsWith('l')?-1:1)*DOOR_OPEN : 0, 640);
}
function setTailgate(open){
  const p=parts.tailgate; if(!p) return; S.tailgate=open?1:0;
  tween(p.group.rotation,'x', open?THREE.MathUtils.degToRad(62):0, 780);
}
function setXray(on){
  S.xray=on;
  for (const id of ['body','panel_bonnet','cabin','seats','glazing','door_fl','door_fr','door_rl','door_rr']){
    const p=parts[id]; if(!p) continue;
    for (const m of p.meshes){
      const mat=m.material; if(!mat) continue;
      if (on){ mat.transparent=true; mat.opacity=(id==='body')?.09:.28; mat.depthWrite=false; }
      else { const b=m.userData.m0; mat.transparent=b.transparent; mat.opacity=b.opacity; mat.depthWrite=b.depthWrite; }
      mat.needsUpdate=true;
    }
  }
}
function setExplode(k){
  S.explode=k;
  for (const id in parts){
    const p=parts[id];
    if (id==='body'){ tweenV(p.group.position,p.home.clone(),420); continue; }
    const d = HINGE[id]
      ? (id==='tailgate' ? new THREE.Vector3(0,.32,-1) : new THREE.Vector3(Math.sign(HINGE[id].x),0,0))
      : p.dir;
    tweenV(p.group.position, p.home.clone().add(d.clone().multiplyScalar(k*.95)), 420);
  }
}
function setWheelOff(id,off){
  const p=parts[id]; if(!p) return; S.wheelOff[id]=off;
  tweenV(p.group.position, p.home.clone().add(
    new THREE.Vector3(Math.sign(p.centre.x)*(off?.85:0), off?.06:0, 0)), 640);
}
function iso(ids){
  S.iso=ids;
  for (const id in parts) parts[id].group.visible = !ids || ids.includes(id);
  padGroup.visible = !!(ids && ids.includes('pads'));
}
/* hover + click */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let hi=null, selected=null;
function hl(id){
  if (hi===id) return;
  parts[hi]?.meshes.forEach(m=>m.material?.emissive?.setHex(0x000000));
  hi=id;
  parts[id]?.meshes.forEach(m=>m.material?.emissive?.setHex(0x0A2038));
}
canvas.addEventListener('pointermove', e => {

    const r=canvas.getBoundingClientRect();

    ray.setFromCamera(ptr,camera);
    const h=ray.intersectObjects([doorRig, ...(parts.door_fl?[parts.door_fl.group]:[])],true)
      .find(x=>x.object.visible);

    canvas.style.cursor = fx ? 'pointer' : 'grab';
    return;
  }
  if (MODE==='bonnetOff' && carReady){
    const r=canvas.getBoundingClientRect();
    ptr.set((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height*2-1));
    ray.setFromCamera(ptr,camera);
    const h=ray.intersectObjects([bonnetRig,bayAsm],true).find(x=>x.object.visible);
    let o=h&&h.object, fx=null;
    while(o&&!fx){ fx=o.userData?.fix||o.userData?.bay; o=o.parent; }
    canvas.style.cursor = fx ? 'pointer' : 'grab';
    return;
  }
  if (MODE!=='strip' || !carReady) return;
  const r=canvas.getBoundingClientRect();
  ptr.set((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height*2-1));
  ray.setFromCamera(ptr,camera);
  const h=ray.intersectObjects(carRoot.children,true).find(x=>x.object.isMesh&&x.object.visible);
  hl(h?h.object.userData.partId:null); canvas.style.cursor=h?'pointer':'grab';
});
canvas.addEventListener('click', ()=>{ if(MODE==='strip'&&hi){ selected=hi; drawPanel(); } });
/* the fasteners are clickable objects in the scene — that is the difference
   between "press a button and the door opens" and doing the job */
canvas.addEventListener('pointerdown', e => {
  if (MODE!=='doorOff' || !carReady) return;

/* Diagnose bay: tap a probe point ON THE CAR. The panel's lists do the same
   thing for a phone, but the whole point of this bay is that the points are
   on the components, not on a schematic. */
canvas.addEventListener('pointerdown', e => {
  if (MODE!=='diag' || !carReady) return;
  const r=canvas.getBoundingClientRect();
  ptr.set((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height*2-1));
  ray.setFromCamera(ptr,camera);
  const h=ray.intersectObjects([diagRig,bayAsm],true).find(x=>x.object.visible);

canvas.addEventListener('pointerdown', e => {

/* ═════════════════════════════════════════════════════════════════════
   CONSTRUCTED: INSIDE A DOOR
   Built in code, because the GLB has door skins and cards but nothing
   between them. Laid out in the X–Y plane, thickness on Z, viewed from
   inside the car looking outward — the view you get with the card off.
   ═══════════════════════════════════════════════════════════════════ */
const doorAsm = new THREE.Group(); sceneRig.add(doorAsm);
const DOOR = {win:0, card:true, latch:0};
const dParts = {};
function buildDoor(){
  const M = (c,o={}) => new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.35,...o});

  /* outer skin — the painted panel you see from the street */
  dParts.skin = add(paint,0,.52,-.055, new THREE.BoxGeometry(1.22,1.00,.012));

  const fr=new THREE.BoxGeometry(1.22,.09,.055);

  const fv=new THREE.BoxGeometry(.09,1.00,.055);

  dParts.drum = add(steel,.30,.20,.02, new THREE.CylinderGeometry(.055,.055,.035,20));
  dParts.drum.rotation.x = Math.PI/2;

  dParts.motor.rotation.x = Math.PI/2;

  dParts.pawl  = add(M(0xb04a2a,{metalness:.7}),-.585,.42,.01, new THREE.BoxGeometry(.05,.05,.045));
  add(steel,-.66,.42,.01, new THREE.CylinderGeometry(.013,.013,.09,12)).rotation.z=Math.PI/2;

  dParts.actuator = add(plastic,-.40,.26,.02, new THREE.BoxGeometry(.11,.08,.06));

  dParts.speaker = add(plastic,.24,.20,-.01, new THREE.CylinderGeometry(.085,.085,.055,24));
  dParts.speaker.rotation.x = Math.PI/2;
  const loom = new THREE.CatmullRomCurve3([new THREE.Vector3(.58,.14,.03),
    new THREE.Vector3(.30,.30,.045), new THREE.Vector3(-.05,.28,.045),
    new THREE.Vector3(-.40,.34,.04), new THREE.Vector3(-.56,.60,.03)]);
  dParts.loom = add(M(0x171a1f,{metalness:.1,roughness:.9}),0,0,0,
    new THREE.TubeGeometry(loom,40,.011,10,false));
  /* vapour barrier, then the trim card over the lot */

    opacity:.34,roughness:.9,side:THREE.DoubleSide}),0,.52,.045, new THREE.PlaneGeometry(1.14,.94));
  dParts.card = add(plastic,0,.52,.085, new THREE.BoxGeometry(1.16,.96,.028));
  dParts.armrest = add(plastic,-.06,.34,.135, new THREE.BoxGeometry(.52,.12,.10));
  dParts.pull = add(M(0x9aa3b0,{metalness:.8,roughness:.3}),-.40,.62,.12,

function doorTick(){

const starterAsm = new THREE.Group(); sceneRig.add(starterAsm);
const ST = {key:0, spin:0, throwPos:0, ring:0};
const sParts = {};
function buildStarter(){
  const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.7,...o});
  const cast=M(0x6e767f,{roughness:.62,metalness:.5}), cu=M(0xb87333,{metalness:.9,roughness:.3}),
        steel=M(0x98a1ad,{metalness:.92,roughness:.28}), dark=M(0x1d2127,{metalness:.2,roughness:.8});
  const add=(m,g,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);starterAsm.add(o);return o};
  /* body, cut away so the armature shows */
  const body = add(cast,new THREE.CylinderGeometry(.075,.075,.26,28,1,false,0,Math.PI*1.35),0,.30,0);
  body.rotation.z = Math.PI/2; sParts.body = body;
  sParts.arm = add(steel,new THREE.CylinderGeometry(.052,.052,.23,24),0,.30,0);
  sParts.arm.rotation.z = Math.PI/2;
  /* A winding runs ALONG the armature, not out of it. The first version
     rotated each bar 90 deg about Z first, which turned its long axis
     radial — ten copper spikes sticking through the housing. The box is
     already long on X (the axle), so it only needs positioning at radius
     and rolling about X. Found by looking at the render. */
  for (let i=0;i<10;i++){
    const a0=i/10*Math.PI*2;
    const w = add(cu,new THREE.BoxGeometry(.205,.013,.013),0,.30,0);
    w.rotation.x=a0;
    w.position.set(0,.30+Math.cos(a0)*.056, Math.sin(a0)*.056);
    (sParts.wind ||= []).push({m:w,a:a0});
  }
  sParts.comm = add(cu,new THREE.CylinderGeometry(.040,.040,.032,22),-.145,.30,0);
  sParts.comm.rotation.z = Math.PI/2;
  add(dark,new THREE.BoxGeometry(.022,.030,.022),-.145,.348,0);
  add(dark,new THREE.BoxGeometry(.022,.030,.022),-.145,.252,0);
  /* solenoid, plunger, fork */
  add(cast,new THREE.CylinderGeometry(.040,.040,.135,22),.02,.415,0).rotation.z=Math.PI/2;
  sParts.plunger = add(steel,new THREE.CylinderGeometry(.020,.020,.10,14),.05,.415,0);
  sParts.plunger.rotation.z = Math.PI/2;
  sParts.fork = add(steel,new THREE.BoxGeometry(.016,.15,.05),.105,.36,0);
  /* drive: shaft + pinion with real teeth */
  sParts.shaft = add(steel,new THREE.CylinderGeometry(.020,.020,.20,14),.19,.30,0);
  sParts.shaft.rotation.z = Math.PI/2;
  sParts.pinion = new THREE.Group(); sParts.pinion.position.set(.255,.30,0); starterAsm.add(sParts.pinion);
  sParts.pinion.add(new THREE.Mesh(new THREE.CylinderGeometry(.034,.034,.042,20), steel));
  sParts.pinion.children[0].rotation.z = Math.PI/2;
  for (let i=0;i<9;i++){
    const t=new THREE.Mesh(new THREE.BoxGeometry(.042,.016,.013), steel);
    const a=i/9*Math.PI*2; t.position.set(0,Math.cos(a)*.038,Math.sin(a)*.038); t.rotation.x=a;
    sParts.pinion.add(t);
  }
  /* flywheel ring gear — the thing it has to engage */
  sParts.ring = new THREE.Group(); sParts.ring.position.set(.40,.30,0); starterAsm.add(sParts.ring);
  const rg=new THREE.Mesh(new THREE.TorusGeometry(.20,.022,12,64), cast);
  rg.rotation.y = Math.PI/2; sParts.ring.add(rg);
  for (let i=0;i<44;i++){
    const t=new THREE.Mesh(new THREE.BoxGeometry(.040,.017,.014), cast);
    const a=i/44*Math.PI*2; t.position.set(0,Math.cos(a)*.178,Math.sin(a)*.178); t.rotation.x=a;
    sParts.ring.add(t);
  }
  starterAsm.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
  starterAsm.visible = false;
}
function starterTick(dt){
  const engaged = ST.key>.5;
  ST.throwPos += ((engaged?1:0) - ST.throwPos) * Math.min(1, dt*7);
  const shove = ST.throwPos*.055;
  sParts.plunger.position.x = .05 - ST.throwPos*.035;
  sParts.fork.rotation.z = -ST.throwPos*.30;
  sParts.pinion.position.x = .255 + shove;
  const meshed = ST.throwPos > .82;
  ST.spin += ((engaged?1:0) - ST.spin) * Math.min(1, dt*(engaged?3.2:5));
  const w = ST.spin*34;
  sParts.arm.rotation.x += w*dt; sParts.comm.rotation.x = sParts.arm.rotation.x;
  sParts.pinion.rotation.x += w*dt;
  for (const {m,a} of (sParts.wind||[])){
    const r = sParts.arm.rotation.x + a;
    m.position.set(0,.30+Math.cos(r)*.056, Math.sin(r)*.056); m.rotation.x = r;
  }
  if (meshed) ST.ring += w*dt*(9/44);            /* 9 teeth driving 44 */
  sParts.ring.rotation.x = ST.ring;
}

/* ═════════════════════════════════════════════════════════════════════
   CONSTRUCTED: FOUR-STROKE ENGINE
   ═══════════════════════════════════════════════════════════════════ */
const engAsm = new THREE.Group(); sceneRig.add(engAsm);
const ENG = {angle:0, rpm:900, running:true, cutaway:true, focus:null};
const eP = {pistons:[],rods:[],throws:[],valves:[],flames:[],bores:[]};
const CR=.215, RL=.60, BORE=.33, PITCH=.50;
const FIRING=[0,540,180,360];                    /* cyl 1,2,3,4 → 1-3-4-2 */
function buildEngine(){
  const steel=new THREE.MeshStandardMaterial({color:0x99a1ad,metalness:.9,roughness:.32});
  const alu=new THREE.MeshStandardMaterial({color:0xb7bec7,metalness:.72,roughness:.42});
  const gl=new THREE.MeshStandardMaterial({color:0x6d7c8c,metalness:.1,roughness:.16,
    transparent:true,opacity:.17,side:THREE.DoubleSide});
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,PITCH*4.2,24),steel);
  sh.rotation.z=Math.PI/2; sh.position.y=.30; engAsm.add(sh);
  eP.crank=new THREE.Group(); eP.crank.position.y=.30; engAsm.add(eP.crank);
  for (let i=0;i<4;i++){
    const x=(i-1.5)*PITCH;
    const bore=new THREE.Mesh(new THREE.CylinderGeometry(BORE/2,BORE/2,.70,32,1,true),gl);
    bore.position.set(x,.95,0); engAsm.add(bore); eP.bores.push(bore);
    const p=new THREE.Mesh(new THREE.CylinderGeometry(BORE/2-.012,BORE/2-.012,.21,28),alu);
    p.position.x=x; engAsm.add(p); eP.pistons.push(p);
    const rod=new THREE.Mesh(new THREE.BoxGeometry(.048,RL,.085),steel);
    rod.position.x=x; engAsm.add(rod); eP.rods.push(rod);
    const th=new THREE.Group();
    const pin=new THREE.Mesh(new THREE.CylinderGeometry(.050,.050,.15,18),steel);
    pin.rotation.z=Math.PI/2; pin.position.y=CR;
    const web=new THREE.Mesh(new THREE.BoxGeometry(.055,CR+.15,.19),steel); web.position.y=CR/2;
    th.add(pin,web); th.position.x=x;
    if (i===1||i===2) th.rotation.x=Math.PI;      /* cyl 2 & 3 throws at 180° */
    eP.crank.add(th); eP.throws.push(th);
    const vs=[];
    for (const [k,dz] of [[0,-.082],[1,.082]]){
      const v=new THREE.Group();
      const st=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.20,12),steel); st.position.y=.10;
      const hd=new THREE.Mesh(new THREE.CylinderGeometry(.072,.060,.028,20),
        new THREE.MeshStandardMaterial({color:k?0xc4643a:0x5f96d6,metalness:.82,roughness:.32}));
      v.add(st,hd); v.position.set(x,1.30,dz); engAsm.add(v); vs.push(v);
    }
    eP.valves.push(vs);
    const fl=new THREE.PointLight(0xFF6A1E,0,1.3,2); fl.position.set(x,1.22,0);
    engAsm.add(fl); eP.flames.push(fl);
  }
  eP.head=new THREE.Mesh(new THREE.BoxGeometry(PITCH*4.2,.10,.60),
    new THREE.MeshStandardMaterial({color:0x767d87,metalness:.7,roughness:.5,
      transparent:true,opacity:.42}));
  eP.head.position.y=1.30; engAsm.add(eP.head);
  engAsm.visible=false;
}
const pistonY = d => { const t=THREE.MathUtils.degToRad(d);
  return CR*Math.cos(t)+Math.sqrt(RL*RL-(CR*Math.sin(t))**2); };
const STROKE = a => a<180?['Power','var(--warn)']:a<360?['Exhaust','var(--ink2)']
                    :a<540?['Intake','var(--pri2)']:['Compression','var(--danger)'];
const lift = (a,ex) => { const [o,c]=ex?[145,375]:[345,575];
  const w=((a-o)%720+720)%720, sp=c-o; return w>sp?0:Math.sin(Math.PI*w/sp); };
function engineTick(dt){
  if (ENG.running) ENG.angle=(ENG.angle+ENG.rpm*6*dt)%720;
  const base=ENG.angle;
  eP.crank.rotation.x=THREE.MathUtils.degToRad(base);
  for (let i=0;i<4;i++){
    const a=(base+FIRING[i])%720, t=THREE.MathUtils.degToRad(a);
    const y=pistonY(a), pinY=CR*Math.cos(t), pinZ=CR*Math.sin(t);
    eP.pistons[i].position.y=.30+y+.055;
    const topY=.30+y, pY=.30+pinY, pZ=pinZ;
    eP.rods[i].position.set(eP.rods[i].position.x,(pY+topY)/2,pZ/2);
    eP.rods[i].rotation.x=Math.atan2(-pZ,topY-pY);
    for (const [k,v] of eP.valves[i].entries()) v.position.y=1.30-lift(a,k)*.062;
    eP.flames[i].intensity=(a<26?(1-a/26):0)*5.2;
    const on = ENG.focus===null || ENG.focus===i;
    eP.pistons[i].visible=eP.rods[i].visible=on;
    eP.bores[i].visible=on&&ENG.cutaway;
    eP.valves[i].forEach(v=>v.visible=on);
  }
  eP.head.visible=ENG.cutaway;
}
buildDoor(); buildStarter(); buildEngine();

/* ═════════════════════════════════════════════════════════════════════
   TAKE THE DOOR OFF — a physical job, not a button

   The four hinge bolts, the loom boot and the door prop are CONSTRUCTED and
   placed on measured geometry: the door skin's leading edge rakes back with
   the A-pillar, so the lower hinge sits at z +0.845 and the upper at +0.745.
   The CHECK STRAP is real — Ext_Door_Limiter_FL, measured at
   (0.781, 0.624, 0.686) — so the trainee releases the actual part.

   Nothing here is a cosmetic animation. Every fastener has a prerequisite,
   and trying it early is REFUSED with the reason, on the Union-Alpha
   "simulator hard stop" principle: a trainer that lets you do the dangerous
   thing and then plays a nice animation has taught you the wrong lesson.
   ═══════════════════════════════════════════════════════════════════ */
const FIX = {
  bolt_ul:{label:'Upper hinge bolt — top',    p:[ .832,1.085, .745]},
  bolt_ll:{label:'Upper hinge bolt — bottom', p:[ .832,1.015, .745]},
  bolt_bl:{label:'Lower hinge bolt — top',    p:[ .838, .555, .845]},
  bolt_bb:{label:'Lower hinge bolt — bottom', p:[ .838, .485, .845]}};
const DO = {looked:false, isolated:false, supported:false, loom:false,
            strap:false, marked:false, out:{}, off:false, tool:null,
            stops:0, log:[]};
const doorRig = new THREE.Group();
const dRig = {bolts:{}, marks:[], hinges:[]};
function buildDoorRig(){
  const steel=new THREE.MeshStandardMaterial({color:0x7d858f,metalness:.9,roughness:.32});
  const done =new THREE.MeshStandardMaterial({color:0x34D399,metalness:.5,roughness:.4});

    head.rotation.z=Math.PI/2;

    shank.rotation.z=Math.PI/2; shank.position.x=-.03;

  for (const [y,z] of [[1.05,.745],[.52,.845]]){

  const base=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.03,16),
    new THREE.MeshStandardMaterial({color:0x444a53,metalness:.6,roughness:.5}));

/* the gate for every action, and the reason it refuses */
function doorGate(act){
  if (act==='loom'){
    if (!DO.looked) return 'Look the procedure up first. You do not know yet what this door carries — on many cars the door loom includes airbag circuits, and finding that out afterwards is too late.';
    if (!DO.isolated) return 'Battery still connected. The door loom can carry SRS circuits, and disturbing a live airbag circuit is how they deploy in your hands. Isolate it and wait the stated time.';
  }
  if (act && act.startsWith('bolt')){
    if (!DO.looked) return 'Look the procedure up first, so you use the tool the data specifies rather than the one that nearly fits. That is how hinge bolts get rounded off.';
    if (DO.tool===null) return 'No tool selected. Pick the one the procedure calls for.';
    if (DO.tool!==0) return 'STOP — wrong tool. A near-enough socket or an adjustable spanner rounds the head off a hinge bolt, and a rounded hinge bolt turns a 40-minute door removal into a drilling and extracting job. Use what the data specifies.';
    if (!DO.loom) return 'STOP — the loom is still plugged in. Take the hinge bolts out now and the door drops away on its wiring: stretched conductors, a torn boot, and on a car with door SRS a damaged airbag circuit.';
    if (!DO.strap) return 'STOP — the check strap is still attached. With the hinges out the whole weight of the door hangs on the strap. It bends, or it pulls its mount out of the pillar, and now you have a body repair as well.';
    if (!DO.supported) return 'STOP — nothing is under the door. It is around 25–30 kg with the glass and trim in it. Take the last bolt out with nothing supporting it and it falls: on the sill, on the paint, or on you.';
  }
  if (act==='lift'){
    const left=Object.keys(FIX).filter(k=>!DO.out[k]);
    if (left.length) return `${left.length} hinge bolt${left.length>1?'s':''} still in. It is not coming off, and levering at it bends the hinge.`;
  }
  return null;
}
function doorAct(act){
  const stop=doorGate(act);
  if (stop){ DO.stops++; DO.log.unshift({bad:true,t:stop}); drawPanel(); return; }
  if (act==='look'){ DO.looked=true; DO.log.unshift({t:'Procedure read. Fastener list and tool for this job are now known.'}); }
  if (act==='isolate'){ DO.isolated=true; DO.log.unshift({t:'Battery isolated, wait observed.'}); }
  if (act==='support'){ DO.supported=true; dRig.prop.visible=true;
    DO.log.unshift({t:'Door supported. The prop carries the weight, not the last bolt.'}); }
  if (act==='loom'){ DO.loom=true; tweenV(dRig.boot.position,
      new THREE.Vector3(.60,.80,.86),500);
    DO.log.unshift({t:'Loom disconnected at the hinge pillar and pulled clear.'}); }
  if (act==='strap'){ DO.strap=true;
    const p=parts.door_fl; DO.log.unshift({t:'Check strap released at the pillar end.'}); }
  if (act==='mark'){ DO.marked=true;
    for (const h of dRig.hinges){
      const m=new THREE.Mesh(new THREE.BoxGeometry(.004,.10,.05),
        new THREE.MeshStandardMaterial({color:0xE7ECF2,emissive:0x333333,roughness:.6}));
      m.position.set(h.position.x+.030,h.position.y,h.position.z); doorRig.add(m); dRig.marks.push(m);
    }
    DO.log.unshift({t:'Hinge positions marked. Without this the door goes back misaligned and you chase the shut line for an hour.'}); }
  if (act && act.startsWith('bolt')){
    DO.out[act]=true; const b=dRig.bolts[act];
    b.head.material=b.done; b.shank.material=b.done;
    tweenV(b.g.position,new THREE.Vector3(FIX[act].p[0]+.16,FIX[act].p[1]-.05,FIX[act].p[2]+.05),480);
    DO.log.unshift({t:`${FIX[act].label} out.`}); }
  if (act==='lift'){ DO.off=true;
    const p=parts.door_fl;
    if (p){ tween(p.group.rotation,'y',-0.30,900);
      tweenV(p.group.position,p.home.clone().add(new THREE.Vector3(.55,-.05,.22)),900); }
    DO.log.unshift({t:DO.marked
      ? 'Door off, and the hinges are marked — it will go back where it came from.'
      : 'Door off. You did NOT mark the hinges, so refitting is now trial and error on the shut line.'}); }
  if (act==='reset'){
    Object.assign(DO,{looked:false,isolated:false,supported:false,loom:false,strap:false,
      marked:false,out:{},off:false,tool:null,stops:0,log:[]});
    dRig.prop.visible=false;
    dRig.boot.position.set(.775,.82,.80);
    for (const k in dRig.bolts){ const b=dRig.bolts[k];
      b.head.material=b.steel; b.shank.material=b.steel; b.g.position.set(...FIX[k].p); }
    for (const m of dRig.marks) doorRig.remove(m); dRig.marks.length=0;
    const p=parts.door_fl; if(p){ p.group.rotation.y=0; p.group.position.copy(p.home); }
  }
  drawHud(); drawPanel();
}

/* ═════════════════════════════════════════════════════════════════════
   CONSTRUCTED: WHAT IS UNDER THE BONNET

   There is NO ENGINE IN THE CAR FILE — no engine, no battery, no airbox,
   no ancillaries of any kind. Open the real bonnet and you look into a
   hollow shell, which is exactly what the owner saw and reported as "no
   engine in car". So the bay is built in code and placed inside the real
   body, positioned against the measured bonnet cavity (panel_cut reported
   the bonnet spanning Z 1.017-2.085, Y 0.700-0.982).

   It is CONSTRUCTED, it says so on screen, and it is a transverse
   four-cylinder layout of the right general shape — NOT a measured model
   of this car's EA888. Its purpose is to give the belt-driven ancillaries
   somewhere true to sit: you cannot teach where an alternator lives by
   pointing into an empty void.
   ═══════════════════════════════════════════════════════════════════ */
const bayAsm = new THREE.Group();

function buildBayEngine(){
  /* A real engine bay is DARK: black plastic covers, black rubber, dull
     alloy. First pass used mid-grey casting at high metalness and the
     whole engine came back bright silver, like a plastic model kit — the
     owner's "engine don't look realistic". Everything is darker and
     rougher, and only the genuinely machined parts stay bright. */
  const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.55,...o});
  const cast=M(0x4b5158,{roughness:.78,metalness:.32}),
        plastic=M(0x1a1e24,{roughness:.86,metalness:.05}),
        alu=M(0x767d86,{metalness:.82,roughness:.42}),
        cu=M(0xb87333,{metalness:.9,roughness:.32}),

  const add=(m,g,x,y,z,grp)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);
    (grp||bayAsm).add(o);return o};

     the bay read as "boxes in a hole" — a real bay is mostly curved rubber
     and loom, and one tube along a spline does more for realism than any
     amount of extra boxes. */
  const hose=(pts,r0,mat,seg=28)=>{
    const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
    return add(mat,new THREE.TubeGeometry(c,seg,r0,12,false),0,0,0);

  add(M(0x30363d,{roughness:.6,metalness:.5}),new THREE.BoxGeometry(.80,.24,.035),0,.50,1.98);
  for (let i=0;i<16;i++)

  /* engine loom: a fat black trunk with branches, the thing that actually

  bP.crankPulley.rotation.z=Math.PI/2;
  /* ALTERNATOR, in its real place: driven off the crank, low on the

  bP.alt=new THREE.Group(); bP.alt.position.set(.34,.70,1.72); bayAsm.add(bP.alt);
  const acase=new THREE.Mesh(new THREE.CylinderGeometry(.072,.072,.135,22),alu);
  acase.rotation.z=Math.PI/2; bP.alt.add(acase);

  /* the belt itself, as a flat loop round both pulleys */

  bayAsm.add(belt);
  /* BATTERY with a proper case, vent strip, two posts and their CLAMPS —

  add(M(0x181c21,{roughness:.85,metalness:.05}),new THREE.BoxGeometry(.26,.19,.19),-.36,.595,1.28);
  add(M(0x22272e,{roughness:.7,metalness:.08}),new THREE.BoxGeometry(.265,.022,.195),-.36,.70,1.28);
  add(M(0x2c323a,{roughness:.6,metalness:.1}),new THREE.BoxGeometry(.19,.014,.035),-.36,.716,1.28);

  for (const [x,c] of [[-.27,0xB3202B],[-.45,0x1b1f24]]){

  hose([[-.45,.735,1.23],[-.40,.60,1.28],[-.32,.48,1.32]],.012,

  /* coolant bottle with a cap, and the strut tops */

  add(M(0x1c2026,{roughness:.7,metalness:.1}),
    new THREE.CylinderGeometry(.036,.036,.026,16),.44,.722,1.30);
  for (const x of [-.52,.52]){
    add(cast,new THREE.CylinderGeometry(.085,.085,.09,20),x,.675,1.42);
    add(M(0x8d949d,{roughness:.4,metalness:.8}),
      new THREE.TorusGeometry(.062,.010,8,20),x,.722,1.42).rotation.x=Math.PI/2;
    for (let i=0;i<3;i++){    /* strut-top nuts */

  /* ── the parts a diagnosis actually touches ──────────────────────────
     Each one carries userData.tp, which is what the Diagnose bay probes.

  bP.ect.rotation.x=Math.PI/2.2;
  bP.ckp=add(plastic,new THREE.BoxGeometry(.045,.040,.055),-.16,.415,1.38);
  bP.coil=new THREE.Group(); bayAsm.add(bP.coil);
  for (let i=0;i<4;i++){

    c.position.set(-.21+i*.14,.90,1.51); bP.coil.add(c);

/* ═════════════════════════════════════════════════════════════════════
   CONSTRUCTED: HOW AN ALTERNATOR WORKS

   Owner asked to "show how alternator work". A starter turns electricity
   into rotation for a few seconds; an alternator does the opposite for the
   whole life of the engine, and the part trainees get wrong is that it
   generates AC and has to rectify it, and that the FIELD is what controls
   output — not the speed.

   Nothing here is measured off this car: it is the standard claw-pole
   machine — rotor field winding fed through slip rings and brushes, three
   stator phases, six diodes, a regulator. The arithmetic below is a
   deliberately simple model and says so.
   ═══════════════════════════════════════════════════════════════════ */
const altAsm = new THREE.Group(); sceneRig.add(altAsm);
const ALT = {rpm:900, field:true, load:1, diode:true, angle:0, cut:false};
const aP = {phases:[], diodes:[], fingers:[]};
const ALT_RATIO = 2.6;            /* pulley ratio, crank -> alternator */
function altSolve(){
  const arpm = ALT.rpm*ALT_RATIO;
  const spin = arpm > 1100;                 /* cut-in: below it, no output */
  /* capability rises with speed and saturates; a failed diode costs a third */
  const cap = (spin ? Math.min(1,(arpm-1100)/4400) : 0) * (ALT.diode?140:92);
  const demand = [18,42,78,124][ALT.load];  /* ignition / lamps / blower+heat / everything */
  const charging = ALT.field && spin;
  const V = !charging ? Math.max(11.4, 12.62 - demand*.009)
          : (demand<=cap ? 14.40 : Math.max(12.1, 14.40-(demand-cap)*.031));
  const ripple = !charging ? 0 : (ALT.diode ? .28 : 2.60);
  const lamp = !charging || V < 13.0;       /* battery warning lamp */
  return {arpm,spin,cap,demand,charging,V,ripple,lamp};
}
function buildAlternator(){
  const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.7,...o});
  const alu=M(0x9aa3af,{metalness:.9,roughness:.3}), cu=M(0xb87333,{metalness:.9,roughness:.3}),
        steel=M(0x8d95a1,{metalness:.92,roughness:.3}), dark=M(0x1d2127,{metalness:.2,roughness:.8}),
        board=M(0x1F3A2C,{metalness:.1,roughness:.7});
  const add=(m,g,x,y,z,grp)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);
    (grp||altAsm).add(o);return o};

  /* HOUSING: cut away AND translucent. The starter's solid arc works because
     its camera sits in the gap; here the first render came back as a solid
     grey drum hiding every internal the bay exists to show. Hunting the right
     arc rotation costs a render per guess — a see-through case reads correctly
     from every angle instead, and the trainee can still orbit into the gap. */
  const glass=new THREE.MeshStandardMaterial({color:0xaeb6c2,transparent:true,
    opacity:.26,roughness:.22,metalness:.85,side:THREE.DoubleSide,depthWrite:false});
  const h=add(glass,new THREE.CylinderGeometry(.115,.115,.20,30,1,true,0,Math.PI*1.3),0,.30,0);
  h.rotation.z=Math.PI/2;
  /* end castings as RIMS, not discs. As solid discs the near one faced the
     camera and hid everything behind it — the same mistake as the solid
     housing, one step in. A rim still reads as the case. */
  for (const x of [-.10,.10]){
    const e=add(alu,new THREE.TorusGeometry(.108,.013,10,34),x,.30,0);
    e.rotation.y=Math.PI/2;
  }

  /* STATOR — three phase windings in a ring. This is where the current is
     actually made; the rotor only carries the magnetic field. */
  const st=add(steel,new THREE.TorusGeometry(.098,.022,10,40),0,.30,0);
  st.rotation.y=Math.PI/2;
  for (let p=0;p<3;p++){
    const g=new THREE.Group(); g.position.set(0,.30,0); altAsm.add(g);
    for (let k=0;k<6;k++){
      const a=(p/3+k/18)*Math.PI*2;
      const c=new THREE.Mesh(new THREE.BoxGeometry(.13,.020,.016),cu.clone());
      c.position.set(0,Math.cos(a)*.098,Math.sin(a)*.098); c.rotation.x=a;
      g.add(c);
    }
    aP.phases.push(g);
  }

  /* ROTOR — shaft, field winding, and the claw poles that alternate N/S */
  aP.rotor=new THREE.Group(); aP.rotor.position.set(0,.30,0); altAsm.add(aP.rotor);
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(.016,.016,.34,14),steel);
  sh.rotation.z=Math.PI/2; aP.rotor.add(sh);
  const fw=new THREE.Mesh(new THREE.CylinderGeometry(.052,.052,.07,20),cu);
  fw.rotation.z=Math.PI/2; aP.rotor.add(fw); aP.field=fw;
  for (let i=0;i<12;i++){
    const a=i/12*Math.PI*2, side=(i%2)?-1:1;
    const f=new THREE.Mesh(new THREE.BoxGeometry(.055,.030,.022),steel);
    f.position.set(side*.036,Math.cos(a)*.070,Math.sin(a)*.070); f.rotation.x=a;
    aP.rotor.add(f); aP.fingers.push(f);
  }
  /* slip rings + brushes: the only sliding contact in the machine, and the
     usual reason a working alternator stops charging */
  aP.slip=new THREE.Mesh(new THREE.CylinderGeometry(.030,.030,.030,18),cu);
  aP.slip.rotation.z=Math.PI/2; aP.slip.position.x=-.125; aP.rotor.add(aP.slip);
  for (const s of [1,-1]) add(dark,new THREE.BoxGeometry(.016,.028,.016),-.125,.30+s*.046,0);

  /* PULLEY + belt stub — driven from the crank, ~2.6 times crank speed */
  aP.pulley=new THREE.Group(); aP.pulley.position.set(.195,.30,0); altAsm.add(aP.pulley);
  const pul=new THREE.Mesh(new THREE.CylinderGeometry(.050,.050,.030,22),alu);
  pul.rotation.z=Math.PI/2; aP.pulley.add(pul);
  for (let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const rib=new THREE.Mesh(new THREE.BoxGeometry(.031,.010,.008),dark);
    rib.position.set(0,Math.cos(a)*.050,Math.sin(a)*.050); rib.rotation.x=a;
    aP.pulley.add(rib);
  }
  /* belt: a short ribbed strap OVER the pulley, suggesting the drive. The
     first version was a .38m black bar running off the top and bottom of
     frame — it read as a girder, not a belt. */
  const belt=new THREE.Mesh(new THREE.TorusGeometry(.052,.006,6,24,Math.PI*1.1),dark);
  belt.position.set(.195,.30,0); belt.rotation.y=Math.PI/2; belt.rotation.z=-Math.PI*.30;
  altAsm.add(belt); aP.belt=belt;

  /* RECTIFIER — six diodes on a heatsink. Three phases in, DC out. */
  const plate=add(board,new THREE.BoxGeometry(.030,.16,.13),-.175,.30,0);
  for (let i=0;i<6;i++){
    const d=new THREE.Mesh(new THREE.CylinderGeometry(.011,.011,.018,12),dark.clone());
    d.rotation.z=Math.PI/2;
    d.position.set(-.175,.30+(i<3?.042:-.042),-.040+(i%3)*.040);
    altAsm.add(d); aP.diodes.push(d);
  }
  /* REGULATOR — the thing that actually decides the output voltage */
  add(dark,new THREE.BoxGeometry(.034,.060,.070),-.205,.235,0);
  /* output stud */
  add(cu,new THREE.CylinderGeometry(.009,.009,.035,10),-.205,.372,.045).rotation.z=Math.PI/2;
  altAsm.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
  altAsm.visible=false;
}
function alternatorTick(dt){
  const r=altSolve();
  /* rotor speed: the pulley and rotor are one shaft, so both turn together */
  const w = r.arpm/60*Math.PI*2*.06;          /* slowed for clarity */
  ALT.angle += w*dt;
  aP.rotor.rotation.x = ALT.angle;
  aP.pulley.rotation.x = ALT.angle;
  /* the field winding only glows when there IS field current */
  aP.field.material.emissive?.setHex(ALT.field ? 0x3a1a06 : 0x000000);
  /* each stator phase peaks 120 degrees apart — that is the whole reason
     the output needs six diodes and not two */
  for (let p=0;p<3;p++){
    const e = r.charging ? Math.max(0,Math.sin(ALT.angle*6 + p*Math.PI*2/3)) : 0;
    for (const c of aP.phases[p].children)
      c.material.emissive?.setRGB(e*.55,e*.22,e*.03);
  }
  aP.diodes.forEach((d,i)=>{
    const dead = !ALT.diode && i===2;         /* the failed one stays dark */
    const e = (r.charging && !dead)
      ? Math.max(0,Math.sin(ALT.angle*6 + (i%3)*Math.PI*2/3 + (i<3?0:Math.PI)))*.5 : 0;
    d.material.emissive?.setRGB(e*.2,e*.5,e*.25);
  });
}
buildAlternator();     /* after its own declarations — see the note above */

/* ═════════════════════════════════════════════════════════════════════
   DIAGNOSE — test real points on the car and find the fault yourself

   Modelled on what Electude's engine-management simulator actually does,
   because the owner asked for it by name: you get a WORK ORDER with the
   customer's words and no fault name, you put meter probes on component
   pins, you read a scan tool, you decide, you replace ONE part, and you
   verify. It scores efficiency (parts replaced) and tidiness (connectors
   back on, codes cleared) — which is also the answer to the review that
   said a stop counter is not an assessment.

   THE ARITHMETIC IS A MODEL AND SAYS SO. One battery internal
   resistance, one earth resistance, one load current per state. It is
   built so the readings stay CONSISTENT with each other: a corroded
   earth shows up as a volt drop across the strap AND a low voltage at
   the starter AND a slow crank, because they are all computed from the
   same resistance. Numbers are typical, not this car's data.
   ═══════════════════════════════════════════════════════════════════ */
const DTP = {
  bat_pos:{l:'Battery positive post',   p:[-.27,.735,1.23]},
  bat_neg:{l:'Battery negative post',   p:[-.45,.735,1.23]},

const DIAG = {caseIdx:0, fault:'alt_brush', state:'ign', mode:'Vdc',
  red:'bat_pos', black:'bat_neg', dtcRead:false, cleared:false,
  replaced:[], disconnected:{}, verdict:null, solved:false, scope:false, log:[]};
function diagNew(i){
  const c = DCASES[(i===undefined) ? Math.floor(Math.random()*DCASES.length) : i];
  Object.assign(DIAG,{caseIdx:DCASES.indexOf(c), fault:c.id, state:'ign', mode:'Vdc',
    red:'bat_pos', black:'bat_neg', dtcRead:false, cleared:false, replaced:[],
    disconnected:{}, verdict:null, solved:false, scope:false, log:[]});
}
/* one physical model, so every reading agrees with every other reading */
function diagPhys(){
  const fixed = k => DIAG.replaced.includes(DCASES.find(c=>c.id===k)?.part);
  const bad = k => DIAG.fault===k && !fixed(k);
  const st = DIAG.state;
  const voc   = bad('battery') ? 12.09 : 12.62;
  const rint  = bad('battery') ? 0.018 : 0.008;
  const rEarth= bad('earth')   ? 0.012 : 0.0004;
  const rStart= 0.028;                        /* starter winding */
  /* SOLVE the cranking current from the circuit — do not assume it.
     Hard-coding it broke the physics in a way that inverted the whole
     lesson: a corroded earth RAISES total resistance, so LESS current
     flows, so the battery sags LESS while the volts appear across the
     bad joint. With a fixed current the battery looked worse than a
     healthy car's and the teaching note was contradicted by its own
     numbers. Caught by testing each fault against its own claim. */
  const I = st==='crank' ? voc/(rStart+rint+rEarth)
          : st==='run'   ? 34 : st==='ign' ? 9 : 0;
  const vbat  = Math.max(5.5, voc - I*rint);
  const drop  = I*rEarth;                     /* across the earth strap */
  const feed  = vbat - drop;                  /* what the starter really sees */
  const spins = st==='crank' && feed > 9.2;
  /* will it actually run? a no-spark / no-fuel fault cranks and never fires */
  const runnable = !bad('ckp') && !bad('fuse') && (bad('battery') ? false : true);
  const running = st==='run';
  const altOut = !running ? vbat
    : bad('alt_brush') ? vbat
    : bad('diode')     ? 13.38 : 14.42;
  const ripple = !running ? 0 : bad('alt_brush') ? 0 : bad('diode') ? 2.61 : 0.27;
  return {vbat,drop,feed,I,spins,runnable,running,altOut,ripple,
          bad,st,lamp: running && altOut < 13.2};
}
/* what the meter says between the two probes, on the selected range */
function diagRead(){
  const m=diagPhys(), r=DIAG.red, b=DIAG.black, pair=new Set([r,b]);
  const has=(x,y)=>pair.has(x)&&pair.has(y);
  const dis=k=>DIAG.disconnected[k];
  if (DIAG.mode==='ohm'){
    if (m.st!=='off') return {v:'---',u:'Ω',n:'Resistance with the circuit live is meaningless — and it can damage the meter. Key off first.'};
    if (has('fuse','bat_pos')) return {v:m.bad('fuse')?'OL':'0.01',u:'Ω',
      n:m.bad('fuse')?'Open circuit. That fuse has blown — and something made it blow.':'Fuse is intact.'};
    if (has('ect','block')) return {v:dis('ect')?'2430':'---',u:'Ω',
      n:dis('ect')?'About 2.4 kΩ — a plausible cold reading for this class of sensor. Check it against the table for the actual car.':'Unplug the sensor before you measure it, or you are reading the ECU pull-up as well.'};
    if (has('coil1','block')) return {v:dis('coil1')?'0.6':'---',u:'Ω',
      n:dis('coil1')?'Primary winding, under an ohm. A shorted or open primary reads far from this.':'Disconnect it first.'};
    if (has('bat_neg','block')) return {v:(m.bad('earth')?'0.04':'0.00'),u:'Ω',
      n:'A static resistance check across an earth strap is a WEAK test — a corroded joint can read near zero and still drop volts under load. Measure the volt drop while cranking instead.'};
    return {v:'OL',u:'Ω',n:'No path between those two points on the resistance range.'};
  }
  if (DIAG.mode==='Vac'){
    if (has('alt_b','bat_neg')||has('alt_b','block'))
      return {v:m.ripple.toFixed(2),u:'V AC',
        n:m.running
          ? (m.ripple>1.5 ? 'That is far too much AC on a DC line. A rectifier diode is open — the classic ripple signature.'
             : m.ripple>0 ? 'A few tenths of a volt of ripple is normal.'
             : 'No output at all, so nothing to ripple.')
          : 'Start the engine to look for ripple.'};
    return {v:'0.00',u:'V AC',n:'No AC here. AC on a DC system is what you hunt at the alternator output.'};
  }
  /* DC volts */
  if (has('bat_pos','bat_neg')) return {v:m.vbat.toFixed(2),u:'V',
    n: m.st==='crank'
      ? (m.vbat<10 ? 'Under 10 V while cranking. A healthy battery holds up much better than this — this one has high internal resistance.'
                   : 'Holding up under crank.')
      : m.st==='run' ? 'Battery terminals with the engine running — this is charging voltage, not battery voltage.'
      : m.vbat<12.3 ? 'Low for a rested battery. Charge and retest before condemning anything.' : 'Normal rested battery voltage.'};
  if (has('bat_neg','block')) return {v:m.drop.toFixed(2),u:'V',
    n: m.st==='crank'
      ? (m.drop>0.2 ? 'VOLT DROP across the engine earth while cranking. Anything much over 0.2 V is turning current into heat in a bad joint instead of torque at the starter.'
                    : 'Under 0.2 V across the earth while cranking — that earth is good.')
      : 'Volt drop only means anything WITH CURRENT FLOWING. Crank it and measure again.'};
  if (has('alt_b','bat_neg')||has('alt_b','block')) return {v:m.altOut.toFixed(2),u:'V',
    n: m.running
      ? (m.altOut<13.0 ? 'Engine running and the output is the same as the battery. It is not charging at all — no field, no output.'
         : m.altOut<14.0 ? 'Charging, but low. Something is costing you output — check AC ripple on this same stud.'
         : 'Charging normally, about 14.4 V.')
      : 'B+ sits at battery voltage with the engine stopped — that tells you nothing yet. Run it.'};
  if (has('fuse','bat_neg')||has('fuse','block')) return {v:(m.bad('fuse')?0:m.vbat).toFixed(2),u:'V',
    n:m.bad('fuse')?'Nothing out of the fuse. Either the fuse is open or its feed is.':'Feed present at the fuse output.'};
  if (has('ckp','bat_neg')||has('ckp','block')) return {v:(m.st==='crank'&&!m.bad('ckp')?'1.8':'0.00'),u:'V AC~',
    n:m.bad('ckp')?'No signal from the crank sensor while cranking. Put the scope on it to be sure — a meter averages a pattern and can lie either way.'
      :(m.st==='crank'?'A signal is present. Judge the SHAPE on the scope, not this number.':'Crank it to see anything here.')};
  if (has('relay','bat_neg')||has('relay','block')) return {v:(m.st==='off'?'0.00':m.vbat.toFixed(2)),u:'V',
    n:'Relay coil feed. A relay that clicks proves the coil, never the contacts.'};
  if (has('coil1','bat_neg')||has('coil1','block')) return {v:(m.st==='off'?'0.00':m.vbat.toFixed(2)),u:'V',
    n:'Coil supply. The switched side needs a scope, not a meter.'};
  if (r===b) return {v:'0.00',u:'V',n:'Both probes on the same point. Voltage is a DIFFERENCE between two places.'};
  return {v:(m.st==='off'?'0.00':(m.vbat*0.99).toFixed(2)),u:'V',
    n:'Not a pairing with a specific meaning in this model — pick two points that form the circuit you are testing.'};
}

   y=0.975 z=1.115, axis X.

   inside the bodywork: invisible, and nothing on screen tells the trainee
   where to click. On a real car this job begins at an open, propped
   bonnet. So 'lift' is a TRANSLATION off the hinges — opening and removing

   Same hard-stop discipline as the door: every fastener has a

/* Placed to be VISIBLE AND TAPPABLE with the bonnet open — the hinge line

const BFIX = {

  bolt_hr:{label:'Hinge bolt — right', p:[ .74, 1.00, 1.16]}};

  strut_l:{label:'Gas strut — left',  a:[-.64, .76, 1.18], b:[-.72, 1.10, 1.46]},
  strut_r:{label:'Gas strut — right', a:[ .64, .76, 1.18], b:[ .72, 1.10, 1.46]}};
const BONNET_OPEN = THREE.MathUtils.degToRad(52);
const BO = {looked:false, supported:false, marked:false, strut:{}, out:{},
