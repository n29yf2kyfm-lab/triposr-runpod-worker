name: Build and Push Building Scanner Docker Image

# ISOLATION (PLAN.md §2.3): this workflow triggers ONLY on building/**.
# The vehicle worker's workflow triggers only on trellis2/**. Neither can
# rebuild the other's production image, which is what keeps the live vehicle
# endpoint safe while this product is developed.
on:
  push:
    branches: [ main ]
    paths:
      - 'building/**'
      - '.github/workflows/building-docker-build.yml'
  workflow_dispatch: {}

jobs:
  test:
    # Fast, GPU-free contract tests. They gate the image build, so a broken
    # job contract never reaches a deployable tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run handler tests
        run: python building/test_handler.py
      - name: Run roof geometry tests
        run: python building/test_roof.py
      - name: Run metric scale tests
        run: python building/test_scale.py
      - name: Run reconstruction tests
        run: python building/test_reconstruct.py
      - name: Run price mode tests
        run: python building/test_takeoff.py
      - name: Run building regulations tests
        run: python building/test_regs.py
      - name: Run safety and access tests
        run: python building/test_safety.py
      - name: Run site and terrain tests
        run: python building/test_terrain.py
      - name: Run material price tests
        run: python building/test_prices.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A cu124 devel base plus Open3D, COLMAP and the reconstruction stack
      # does not fit in the ~14GB free on a stock runner. Strip the
      # preinstalled SDKs first — same lesson as the vehicle build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Production tags only from main: a workflow_dispatch on a feature
      # branch must not overwrite a deployed tag.
      - name: Compute tags
        id: tags
        run: |
          TAGS="alamk123/building-scan:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS
          alamk123/building-scan:v1
          alamk123/building-scan:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: building
          push: true
          # SHA-based tag alongside :latest so RunPod is forced to pull fresh
          # content instead of reusing a cached image for a tag it has already
          # seen — the same stale-worker workaround the vehicle build needs.
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
