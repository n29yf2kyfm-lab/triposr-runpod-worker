name: Build and Push Building Scanner Docker Image

# ISOLATION (PLAN.md §2.3): this workflow triggers ONLY on building/**.
# The vehicle worker's workflow triggers only on trellis2/**. Neither can
# rebuild the other's production image, which is what keeps the live vehicle
# endpoint safe while this product is developed.
#
# TESTS RUN ON EVERY BRANCH; THE IMAGE IS BUILT ONLY FROM MAIN. Restricting
# the whole workflow to main meant the suite never ran in CI on the branch
# where the work actually happens — every commit was gated by one developer
# machine. That is the same hole that let a write_ifc which had never once
# executed reach a deployed image with 1231 tests green. The `if:` on the
# build job below is what keeps the isolation guarantee, not the trigger.
on:
  push:
    paths:
      - 'building/**'
      - '.github/workflows/building-docker-build.yml'
  pull_request:
    paths:
      - 'building/**'
      - '.github/workflows/building-docker-build.yml'
  workflow_dispatch: {}

jobs:
  test:
    # Fast, GPU-free contract tests. They gate the image build, so a broken
    # job contract never reaches a deployable tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # THE DEPENDENCIES THE IMAGE ACTUALLY SHIPS. Without this step the
      # runner is a bare interpreter, so every lazy third-party import in
      # the worker takes its ImportError branch and the tests validate the
      # degraded path instead of the one that runs in production. That is
      # how write_ifc reached the deployed image having never once executed:
      # it used ip_class= for ifc_class= and reached for a submodule it had
      # not imported, and CI could not see either, because CI never had
      # ifcopenshell installed.
      #
      # Deliberately NOT the whole requirements file — torch and the
      # reconstruction stack need a GPU runner and 14GB. These are the
      # CPU-only libraries the contract tests can genuinely exercise.
      - name: Install the libraries the tests exercise
        run: |
          python -m pip install --upgrade pip
          pip install requests ifcopenshell pdfplumber

      - name: Run handler tests
        run: python building/test_handler.py
      - name: Run roof geometry tests
        run: python building/test_roof.py
      - name: Run metric scale tests
        run: python building/test_scale.py
      - name: Run reconstruction tests
        run: python building/test_reconstruct.py
      - name: Run price mode tests
        run: python building/test_takeoff.py
      - name: Run building regulations tests
        run: python building/test_regs.py
      - name: Run safety and access tests
        run: python building/test_safety.py
      - name: Run site and terrain tests
        run: python building/test_terrain.py
      - name: Run material price tests
        run: python building/test_prices.py

      - name: Run supply and price-list import tests
        run: python building/test_supply.py

      - name: Run valuation tests
        run: python building/test_valuation.py

      - name: Run output path tests
        run: python building/test_paths.py

      - name: Run drawing takeoff tests
        run: python building/test_drawing.py

      - name: Run structure segmentation tests
        run: python building/test_structure.py

      - name: Run services X-ray tests
        run: python building/test_services.py

      - name: Run planning constraint tests
        run: python building/test_planning.py

      - name: Run scan registration tests
        run: python building/test_register.py

      - name: Run model (drawing -> 3D) tests
        run: python building/test_model3d.py

      - name: Run Google Solar cross-check tests
        run: python building/test_solar.py

  build:
    needs: test
    # Pushing an image costs a Docker Hub write and ten minutes of runner;
    # a branch does not need one on every commit. Dispatch this workflow
    # deliberately to get a SHA-tagged image off a branch — the tag step
    # below still refuses to move v1 or latest unless it is on main.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A cu124 devel base plus Open3D, COLMAP and the reconstruction stack
      # does not fit in the ~14GB free on a stock runner. Strip the
      # preinstalled SDKs first — same lesson as the vehicle build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Production tags only from main: a workflow_dispatch on a feature
      # branch must not overwrite a deployed tag.
      - name: Compute tags
        id: tags
        run: |
          TAGS="alamk123/building-scan:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS
          alamk123/building-scan:v1
          alamk123/building-scan:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: building
          push: true
          # SHA-based tag alongside :latest so RunPod is forced to pull fresh
          # content instead of reusing a cached image for a tag it has already
          # seen — the same stale-worker workaround the vehicle build needs.
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
