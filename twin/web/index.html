<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Property Digital Twin</title>
<style>
:root{
  --bg:#0e1116; --panel:rgba(18,21,27,.92); --line:#262b35;
  --ink:#eef1f6; --dim:#98a0ae; --accent:#ffd600;
  --verified:#ffd600; --derived:#4fc3f7; --estimated:#b085f5; --user:#39ff88;
  --bad:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  overflow:hidden;-webkit-text-size-adjust:100%}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.dragging{cursor:grabbing}

.panel{position:fixed;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;backdrop-filter:blur(14px);
  box-shadow:0 8px 34px rgba(0,0,0,.5)}

/* search */
#searchWrap{top:14px;left:14px;width:min(390px,calc(100vw - 28px));padding:0;
  overflow:hidden}
#searchRow{display:flex;align-items:center;gap:8px;padding:11px 13px}
#q{flex:1;background:none;border:0;color:var(--ink);font:15px inherit;outline:none}
#q::placeholder{color:var(--dim)}
#go{background:var(--accent);color:#111;border:0;border-radius:8px;
  padding:7px 13px;font:600 13px inherit;cursor:pointer}
#go:disabled{opacity:.45;cursor:default}
#results{max-height:min(46vh,380px);overflow:auto;border-top:1px solid var(--line)}
#results:empty{display:none}
.res{padding:9px 13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.res:hover{background:rgba(255,255,255,.06)}
.res b{font-weight:600}
.res .sub{color:var(--dim);font-size:12px}

/* property panel */
#prop{top:14px;right:14px;width:min(370px,calc(100vw - 28px));
  max-height:calc(100vh - 120px);overflow:auto;padding:14px;display:none}
#prop h2{margin:0 0 2px;font-size:16px}
#prop .addr{color:var(--dim);font-size:12px;margin-bottom:12px}
.sect{border-top:1px solid var(--line);padding:10px 0 4px}
.sect h3{margin:0 0 7px;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.na{color:var(--bad);font-size:12px}
.na small{display:block;color:var(--dim);font-weight:400;margin-top:2px}
.badge{display:inline-block;font-size:10px;letter-spacing:.06em;padding:2px 7px;
  border-radius:99px;text-transform:uppercase;font-weight:700}
.b-verified{background:rgba(255,214,0,.16);color:var(--verified)}
.b-derived{background:rgba(79,195,247,.16);color:var(--derived)}
.b-estimated{background:rgba(176,133,245,.16);color:var(--estimated)}
.b-user{background:rgba(57,255,136,.16);color:var(--user)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--dim);font-size:12px}
.prov{font-size:11px;color:var(--dim);word-break:break-word;
  background:rgba(0,0,0,.3);padding:7px 9px;border-radius:7px;margin-top:6px}
.prov code{color:#9fb4d0}

/* legend + scale */
#imageryWrap{left:14px;bottom:132px;padding:9px 11px;font-size:12px;
  display:flex;gap:8px;align-items:center}
#imageryWrap label{color:var(--dim)}
#imagery{background:#1b1e25;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:5px 7px;font:12px inherit;max-width:230px}
#legend{left:14px;bottom:14px;padding:10px 12px;font-size:12px}
#legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
#legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
#scale{right:14px;bottom:14px;padding:8px 11px;font-size:12px}
#bar{height:5px;background:var(--ink);border:1px solid #000;border-top:0;
  margin-top:4px;transition:width .12s}
#status{left:50%;transform:translateX(-50%);bottom:14px;padding:8px 14px;
  font-size:12.5px;display:none;max-width:min(560px,92vw)}
#attrib{position:fixed;right:14px;bottom:70px;font-size:10.5px;color:var(--dim);
  text-align:right;pointer-events:none;text-shadow:0 1px 3px #000}
@media (max-width:640px){
  #prop{top:auto;bottom:0;left:0;right:0;width:100%;max-height:56vh;
    border-radius:16px 16px 0 0}
  #legend{display:none}
}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div class="panel" id="searchWrap">
  <div id="searchRow">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
         stroke="#98a0ae" stroke-width="2"><circle cx="11" cy="11" r="7"/>
      <path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="Postcode, address or place — anywhere"
           autocomplete="off" spellcheck="false">
    <button id="go">Search</button>
  </div>
  <div id="results"></div>
</div>

<div class="panel" id="prop"></div>

<div class="panel" id="imageryWrap">
  <label for="imagery">Imagery</label>
  <select id="imagery"></select>
</div>

<div class="panel" id="legend">
  <div class="row"><i style="background:var(--verified)"></i>Verified — surveyed/published</div>
  <div class="row"><i style="background:var(--derived)"></i>Derived — computed from measurement</div>
  <div class="row"><i style="background:var(--estimated)"></i>Estimated — inferred by rule</div>
  <div class="row"><i style="background:var(--user)"></i>User — drawn by you</div>
</div>

<div class="panel" id="scale"><span id="scaleTxt">—</span><div id="bar"></div></div>
<div class="panel" id="status"></div>
<div id="attrib"></div>

<script type="module" src="app.js"></script>
</body>
</html>
