# The GLB machine on any server with Docker: one command, from the repository root.
#
#   GLBMACHINE_KEYS=key-for-customer-a,key-for-customer-b docker compose -f pipeline/realcar/docker-compose.yml up -d
#
# Then the Maker is at http://SERVER:8080/make/, the API at http://SERVER:8080/v1/cars
# (each call with `Authorization: Bearer KEY`), GLB Studio at /studio/.
# Put it behind HTTPS (a reverse proxy, or the host's load balancer) before customers use it.
services:
  glbmachine:
    build:
      context: ../..
      dockerfile: pipeline/realcar/Dockerfile
    image: glbmachine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GLBMACHINE_KEYS: ${GLBMACHINE_KEYS:?set GLBMACHINE_KEYS to the licence keys customers may use}
      GLBMACHINE_WORKERS: ${GLBMACHINE_WORKERS:-2}
      # 1 (the default): no CC BY-NC model is ever used; 0 only for a demo server
      GLBMACHINE_COMMERCIAL_ONLY: ${GLBMACHINE_COMMERCIAL_ONLY:-1}
    volumes:
      - glbdata:/data
volumes:
  glbdata:
